<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// #lang=ar|en|fr|es decides the direction before the first paint: no RTL flash on a Latin screen.
(function(){
  var q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var l = q.get('lang');
  if (['ar','en','fr','es'].indexOf(l) < 0) l = 'ar';
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
})();
</script>
<title>شاشة تلفزيونك</title>
<style>
  @font-face{font-family:'Thmanyah';font-weight:300;font-style:normal;font-display:block;src:url("__F_LIGHT__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:400;font-style:normal;font-display:block;src:url("__F_REGULAR__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:500;font-style:normal;font-display:block;src:url("__F_MEDIUM__") format("woff2")}
  /* ﷺ and ﴿﴾ only (2 KB subset of Noto Naskh Arabic, OFL): Thmanyah has no glyph for them */
  @font-face{font-family:'NotoMarks';font-style:normal;font-weight:400;src:url("__F_MARKS__") format("woff2")}
  /* the Quran text only (verse of the day, Quranic adhkar), with the KFGQPC Uthmani text made for it: assets/fonts/UthmanicHafs-NOTICE.txt */
  @font-face{font-family:'UthmanicHafs';font-weight:400;font-style:normal;font-display:block;src:url("__F_HAFS__") format("woff2")}
  @font-face{font-family:'ThmanyahDisplay';font-weight:700;font-style:normal;font-display:block;src:url("__F_DISPLAY__") format("woff2")}

  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --gold-2:#D6AF6B;
    --gold-3:#E0BA74;
    --gold-hi:#FFE9B8;
    --gold-rgb:220,184,111;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  /* National Day and Founding Day (see nationalNow()): the gold accents turn Saudi green, light enough to read on the dark photos */
  html.nat{--gold:#34B872;--gold-2:#2FAE6B;--gold-3:#4CCB88;--gold-hi:#CDF3DD;--gold-rgb:52,184,114}
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .top,html.widget .clockwrap,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:0;display:block;transition:none}
  /* the launcher's cards, up to three: one fills the box; two side by side (the first on the right, as Arabic reads);
     three: two side by side and the third the full width under them. At 1920 a pair is about 560 + 540 px with a 22 px gap. */
  html.widget .mid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--cg,clamp(8px,2vw,22px));align-items:start}
  html.widget .mid.n2,html.widget .mid.n3{grid-template-columns:minmax(0,560fr) minmax(0,540fr)}
  html.widget .mid .week.w3{grid-column:1/-1}
  html.widget .week{width:100%}
  html,body{
    height:100%;overflow:hidden;background:#040E09;color:var(--sand);
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#040E09;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    transform:scale(1.03);   /* edges stay covered while it settles */
  }
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  .veil{
    position:fixed;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(3,10,7,.62) 0%,rgba(3,10,7,.30) 22%,rgba(3,10,7,.12) 46%,rgba(3,10,7,.42) 74%,rgba(2,6,4,.88) 100%),
      radial-gradient(120% 85% at 22% 34%,rgba(3,14,9,.42) 0%,rgba(3,14,9,0) 58%);
  }
  /* photo credits live in PHOTO-CREDITS.md on GitHub, not on screen */
  #credit{display:none;
    position:fixed;left:26px;bottom:6px;z-index:4;
    font-size:10px;letter-spacing:.02em;
    color:rgba(246,239,224,.30);pointer-events:none;
  }
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .top-veil{
    position:fixed;left:0;top:0;width:56vw;height:34vh;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%);
  }
  .bottom-veil{
    position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,7,4,0) 0%,rgba(2,7,4,.55) 42%,rgba(2,6,4,.86) 100%);
  }

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
    /* never wider than the screen: from 10 to 12 o'clock the clock has four digits, and beside a card of long nowrap rows
       the column grew past the edge and pushed the bottom row off screen at 1280 and 960 */
    grid-template-columns:minmax(0,1fr);
  }

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);max-width:100%;justify-self:end;   /* gives way to a wide clock (see .stage) */
    background:rgba(4,14,9,.60);   /* no backdrop blur: over a moving photo it is redone every frame */
    border:1px solid rgba(var(--gold-rgb),.16);
    border-radius:12px;
    padding:1.7vh 1.4vw;
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:calc(clamp(12px,1vw,18px)*var(--z,1));font-weight:500;letter-spacing:.18em;color:var(--gold-2);
  }
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--gold-rgb),.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:calc(clamp(14px,1.16vw,22px)*var(--z,1));font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(var(--gold-rgb),.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:var(--gold-3);font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .mwhen{display:block;font-style:normal;margin-top:.15em;font-size:.68em;font-weight:300;color:#A79C85;overflow:hidden;text-overflow:ellipsis}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:end}
  .week li .tm .cr{width:1.25em;height:1.25em;object-fit:contain;vertical-align:middle;margin-block:-.25em;margin-inline-end:.3em}
  .week li .tm .cr:not([src]){visibility:hidden}   /* a restored row waits for its picture: the same room */
  .week ul.flip li{animation:weekIn .5s ease both}
  .week ul.flip li:nth-child(2){animation-delay:.06s}
  .week ul.flip li:nth-child(3){animation-delay:.12s}
  .week ul.flip li:nth-child(4){animation-delay:.18s}
  .week ul.flip li:nth-child(5){animation-delay:.24s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .week li.task::before{content:'';flex:0 0 auto;width:.4em;height:.4em;border-radius:50%;background:var(--gold);align-self:center}
  .week li.task span{max-width:100%;min-width:0}
  /* «الساعات القادمة»: the next six hours in one row, the earliest on the right */
  .week li.hrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.3em;white-space:normal;border-bottom:none;padding:1.2vh 0 .5vh;align-items:start;text-align:center}
  .week li.hrs .hc{display:flex;flex-direction:column;align-items:center;gap:.4em;min-width:0}
  .week li.hrs .hc b{font-weight:400;font-size:.78em;color:#B9AE96;white-space:nowrap}
  .week li.hrs .hc svg{width:1.9em;height:1.9em;fill:none;stroke:var(--gold-3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .week li.hrs .hc i{font-style:normal;font-variant-numeric:tabular-nums;font-size:1.05em;white-space:nowrap}
  /* «الصلوات في صف»: the five prayers side by side, the next one lit */
  .week li.prow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.3em;white-space:normal;border-bottom:none;padding:.9vh 0 .3vh;text-align:center;align-items:stretch}
  .week li.prow .pc{display:flex;flex-direction:column;align-items:center;gap:.3em;padding:.55em .1em;border-radius:.7em;min-width:0}
  .week li.prow .pc b{font-weight:500;white-space:nowrap}
  .week li.prow .pc i{font-style:normal;font-size:.8em;color:#B9AE96;white-space:nowrap;font-variant-numeric:tabular-nums}
  .week li.prow .pc.past{color:#8F8670}
  .week li.prow .pc.past i{color:#7F775F}
  .week li.prow .pc.next{background:rgba(var(--gold-rgb),.18);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.45);color:var(--gold-hi)}
  .week li.prow .pc.next i{color:var(--gold-3)}
  /* the same game in the card: «مباشر · الدقيقة ٦٧» over the two names with the score between, one line (fitLive) */
  .week li.lv{display:block;white-space:normal;text-align:center;border-bottom:none;padding:.5vh 0 .2vh}
  .week li.lv .lvm{font-size:.8em;color:#E6DCC4;margin-bottom:.35em}
  .week li.lv .lvt{display:flex;align-items:center;justify-content:center;gap:.55em;white-space:nowrap;overflow:hidden;
    font-size:calc(clamp(21px,2vw,38px)*var(--z,1)*var(--k,1));font-weight:500;line-height:1.35}
  .week li.lv .lvt > *{flex:0 0 auto}   /* nothing shrinks: what does not fit is measured and stepped down (fitLive) */
  .week li.lv .lvt .tm{display:inline-flex;align-items:center}
  .week li.lv .lvt .tm .cr{flex:0 0 auto}
  .week li.lv .lvt .tm .cr{width:1.35em;height:1.35em;margin-block:0;margin-inline-end:.35em}
  .week li.lv .sc{color:var(--gold-hi);font-size:1.25em;font-weight:700;font-variant-numeric:tabular-nums;padding:0 .1em}
  /* «يومك»: a small name, then the thing itself (it may wrap, never «…»), then when */
  .week li.td{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.1em .8em;align-items:baseline;white-space:normal}
  .week li.td > span{max-width:none;overflow:visible;text-overflow:clip;padding:0;margin:0}   /* not the list rows' first-name rule */
  .week li.td .k{font-size:.74em;color:#9C9279;white-space:nowrap}
  .week li.td .v{color:#F6EEDC;min-width:0;line-height:1.35}
  .week li.td .r{font-size:.74em;color:var(--gold-3);white-space:nowrap}
  .week li.past{color:#8F8670}
  .week li.next{color:var(--gold-hi)}
  .week li.next .dt{color:var(--gold-3)}
  .week li.quote{white-space:normal;display:block;font-size:calc(clamp(17px,1.5vw,29px)*var(--z,1));line-height:1.75;
    border-bottom:none;padding:.4vh 0 0;color:#FFF7E6}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the NotoMarks subset */
  .week li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:var(--gold-2);
    font-size:1.05em;padding:0 .15em}
  /* ﷺ is not in Thmanyah either: NotoMarks, in gold like the verse brackets so it reads as ornament */
  .week li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:var(--gold-2);font-size:1.6em;line-height:1;vertical-align:-.1em}
  /* the Uthmanic Hafs face is small for its size and its marks stack high: larger, with more leading */
  .week li.quote .qt{font-family:'UthmanicHafs','Thmanyah',serif;font-size:1.32em}
  .week li.quote.quran{line-height:1.95}
  .week li.quote.quran.q1{font-size:calc(clamp(13px,1.3vw,25px)*var(--z,1));line-height:1.85}   /* the Hafs face is wide: a lower floor than the other cards' */
  .week li.quote.quran.q2{line-height:1.8}
  .week li.quote.quran.q3,.week li.quote.quran.q4{line-height:1.55}   /* the longest verses, on the smallest screens, must still fit the card */
  /* «التفسير الميسر» under the verse (#tafsir=1): small and dim, three lines at most (fitTafsir) */
  .week li.tafsir{white-space:normal;display:block;border-bottom:none;padding:.5vh 0 0;line-height:1.65;
    font-size:calc(clamp(11px,.92vw,17px)*var(--z,1));color:#B9AE96}
  /* a full hadith: the isnad and the narration small and muted, the Prophet's words ﷺ at full size */
  .week li.quote.hadith{font-size:calc(clamp(15px,1.3vw,25px)*var(--z,1));line-height:1.7}
  /* long texts a step smaller (by length, see quoteSize()), so the card never grows past the clock row */
  .week li.quote.q1{font-size:calc(clamp(15px,1.3vw,25px)*var(--z,1))}
  .week li.quote.q2{font-size:calc(clamp(14px,1.16vw,22px)*var(--z,1))}
  .week li.quote.q3{font-size:calc(clamp(13px,1.04vw,20px)*var(--z,1))}
  .week li.quote.q4{font-size:calc(clamp(11px,.88vw,17px)*var(--z,1))}   /* the adhkar card's longest, the end of al-Baqara with harakat */
  .week li.quote.hadith.q1{font-size:calc(clamp(14px,1.16vw,22px)*var(--z,1))}
  .week li.quote.hadith.q2{font-size:calc(clamp(13px,1.04vw,20px)*var(--z,1))}
  .week li.quote.hadith.q3{font-size:calc(clamp(12px,.94vw,18px)*var(--z,1))}
  .week li.quote .nar{font-size:.66em;color:#B9AE96}
  .week li.quote .nar .saw{font-size:1.45em}
  .week li.src{border-bottom:none;padding:.6vh 0 0;font-size:calc(clamp(12px,.95vw,18px)*var(--z,1));color:var(--gold-2)}
  /* «أذكار الصباح والمساء»: the header takes a line icon and the window's end; the footer holds source, count and dots */
  .week .hd::after{order:1}
  .week .hd svg{flex:0 0 auto;width:1.5em;height:1.5em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .week .hd .until{order:2;font-size:.9em;font-weight:400;letter-spacing:0;color:#9C9279;white-space:nowrap}
  .week li.stk{align-items:center;gap:.8em}
  .week li.stk .nm{flex:1 1 auto;min-width:0;max-width:none;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li.stk .cl{font-size:.64em;color:#9C9279;margin-inline-start:.6em}
  .week li.stk svg{flex:0 0 auto;width:4.4em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .week li.stk svg polyline{vector-effect:non-scaling-stroke}
  .week li.stk .px{flex:0 0 auto;min-width:3.6em;text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
  .week li.stk .chg{flex:0 0 auto;min-width:4.9em;text-align:end;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li.stk .up{color:#79D6A0}
  .week li.stk .down{color:#EE8B70}
  .week li.adf{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.8em;align-items:center;
    border-bottom:none;padding:.6vh 0 0;font-size:calc(clamp(12px,.95vw,18px)*var(--z,1));color:var(--gold-2)}
  .week li.adf .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:.3em;margin-bottom:-.3em}
  .week li.adf .c{color:#B9AE96;font-size:.92em;white-space:nowrap}
  .week li.adf .d{justify-self:end;display:flex;gap:.4em}
  .week li.adf .d i{width:.48em;height:.48em;border-radius:50%;background:rgba(var(--gold-rgb),.26)}
  .week li.adf .d i.on{background:var(--gold-3)}
  /* «السنة»: one dot a day in a single SVG; the days gone rise from dim to gold, today is the brightest with a halo */
  .week li.yr{display:block;white-space:normal;border-bottom:none;padding:.3vh 0 0;text-align:center}
  .week li.yr .yn{font-size:1.3em;font-weight:500;color:var(--gold-hi);line-height:1.1;font-variant-numeric:tabular-nums}
  .week li.yr svg{display:block;width:calc(100%*var(--z,1));height:auto;margin:.6vh auto .5vh}
  .week li.yr .on{fill:rgb(var(--gold-rgb))}
  .week li.yr .off{fill:rgb(var(--gold-rgb));fill-opacity:.14}
  .week li.yr .now{fill:var(--gold-hi)}
  .week li.yr .halo{fill:rgb(var(--gold-rgb))}
  .week li.yr .yt{font-size:.74em;color:#B9AE96;line-height:1.4}
  .week li.yr .yt b{font-weight:500;color:var(--gold-3)}
  @media (prefers-reduced-motion:no-preference){
    .week li.yr.fill .r{animation:yrIn .7s ease both;animation-delay:calc(var(--i) * 70ms)}
    @keyframes yrIn{from{opacity:0}to{opacity:1}}
  }
  .week .empty{color:#9A9078;font-size:calc(clamp(14px,1.1vw,21px)*var(--z,1));font-weight:300;margin-top:1vh}

  /* ===== card styles (#cardstyle=; the default keeps the plain card above) =====
     The blur is never a live backdrop-filter: a pre-blurred copy of the photo is drawn once per photo
     (cardBlurNow) into canvas.bl. Layers inside the card, back to front: canvas.bl, ::before the tint,
     ::after the highlights, then the content. Until the canvas exists the card is just its tint. */
  html[class*="cs-"] .week{position:relative;isolation:isolate;background:none}
  html[class*="cs-"] .week::before,html[class*="cs-"] .week::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none}
  html[class*="cs-"] .week::before{z-index:-2}
  html[class*="cs-"] .week::after{z-index:-1}
  .week canvas.bl{position:absolute;inset:0;width:100%;height:100%;z-index:-3;border-radius:inherit;pointer-events:none;
    opacity:0;transition:opacity .8s ease}
  .week canvas.bl.on{opacity:1}
  .week .frm,.week .dia{display:none}

  html.cs-dark1 .week{border-radius:26px;border-color:rgba(246,239,224,.10)}
  html.cs-dark1 .week::before{background:rgba(8,14,10,.52)}
  html.cs-dark1 .week::after{box-shadow:inset -3px 0 0 var(--gold)}   /* a thin gold line on the edge facing the clock */

  html.cs-glass1 .week{border-radius:34px;border-color:rgba(255,255,255,.22);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  html.cs-glass1 .week::before{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 45%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.10))}
  html.cs-glass1 .week::after{background:radial-gradient(60% 40% at 85% 0%,rgba(255,255,255,.22),transparent 70%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.12)}

  /* framed: an inner gold frame with a diamond on its top and bottom edge, the header centred */
  html.cs-dark3 .week,html.cs-glass3 .week{padding:calc(1.7vh + 8px) calc(1.4vw + 8px)}
  /* the launcher's box is short: the header must clear the diamond on the top edge whatever its height (vh is the box's) */
  html.widget.cs-dark3 .week,html.widget.cs-glass3 .week{padding:calc(24px*var(--z,1)) calc(1.4vw + 8px) calc(18px*var(--z,1))}
  html.widget.cs-dark3 .week .frm,html.widget.cs-glass3 .week .frm{inset:calc(12px*var(--z,1))}
  html.widget.cs-dark3 .week .dia,html.widget.cs-glass3 .week .dia{width:calc(18px*var(--z,1));height:calc(18px*var(--z,1))}
  html.widget.cs-dark3 .week .dia.t,html.widget.cs-glass3 .week .dia.t{top:calc(12px*var(--z,1))}
  html.widget.cs-dark3 .week .dia.b,html.widget.cs-glass3 .week .dia.b{bottom:calc(12px*var(--z,1))}
  html.cs-dark3 .week .frm,html.cs-glass3 .week .frm{display:block;position:absolute;inset:12px;z-index:0;pointer-events:none;
    border:1px solid rgba(var(--gold-rgb),.55);border-radius:14px}
  html.cs-dark3 .week .dia,html.cs-glass3 .week .dia{display:block;position:absolute;left:50%;width:18px;height:18px;z-index:0;
    pointer-events:none;border:1px solid rgba(var(--gold-rgb),.75)}
  html.cs-dark3 .week .dia.t,html.cs-glass3 .week .dia.t{top:12px;transform:translate(-50%,-50%) rotate(45deg)}
  html.cs-dark3 .week .dia.b,html.cs-glass3 .week .dia.b{bottom:12px;transform:translate(-50%,50%) rotate(45deg)}
  html.cs-dark3 .week .hd,html.cs-glass3 .week .hd{justify-content:center}
  html.cs-dark3 .week .hd::after,html.cs-glass3 .week .hd::after{display:none}

  html.cs-dark3 .week{border-radius:22px;border-color:transparent}
  html.cs-dark3 .week::before{background:rgba(7,22,15,.62)}
  html.cs-dark3 .week .dia{background:#07160F}

  html.cs-glass3 .week{border-radius:30px;border-color:rgba(255,255,255,.20);box-shadow:0 24px 60px rgba(0,0,0,.35)}
  html.cs-glass3 .week::before{background:linear-gradient(135deg,rgba(120,200,150,.20),rgba(20,60,40,.10) 50%,rgba(var(--gold-rgb),.12))}
  html.cs-glass3 .week::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.40),inset 0 -1px 0 rgba(255,255,255,.06)}

  .dates{text-align:start;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .natline{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:500;color:var(--gold)}
  .natline[hidden]{display:none}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-inline-end:auto;margin-inline-start:0;
    background:linear-gradient(270deg,var(--gold),rgba(var(--gold-rgb),0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  .mid{display:grid;grid-template-columns:1fr minmax(0,auto);align-items:center;gap:4.5vw}   /* the clock keeps its width; the card takes what is left */
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;
    font-size:clamp(120px,min(17vw,31vh),345px);line-height:.92;letter-spacing:.022em;
    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);

  }
  .subline{
    margin-top:1.4vh;display:flex;align-items:center;gap:.7em;

  .bottom{

    padding-top:2.1vh;
  }
  .panel{min-width:0}
  .panel .label{
    font-size:clamp(12px,.98vw,18px);font-weight:500;letter-spacing:.2em;
    color:var(--gold-2);margin-bottom:.8vh;white-space:nowrap;
  }
  .panel .big{
    display:flex;align-items:baseline;gap:.4em;flex-wrap:nowrap;white-space:nowrap;min-width:0;line-height:1.1;
    font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(22px,2vw,42px);color:var(--sand);
  }
  .panel .num{color:#FFFCF2;font-size:1.12em;font-variant-numeric:tabular-nums;font-weight:500}
  .panel .unit{font-size:.56em;font-weight:500;color:var(--gold)}
  .panel .sub{
    margin-top:.85vh;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em;
  }
  .panel .sub b{color:#F0E6D0;font-weight:500}
  .panel .sub.when{margin-top:.3vh;font-size:.86em;color:#A79C85}

  .p-prayer{text-align:start}
  .p-prayer .big{justify-content:flex-start}
  .p-mid{text-align:center}
  .p-mid .big{display:block;text-align:center;line-height:1.06}
  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .txt{display:inline-block;max-width:100%;white-space:normal;font-size:.5em;line-height:1.3}
  .panel .sub .note{font-size:.9em;color:#A79C85;margin-top:.2vh}
  .p-mid .unit{font-size:.46em;font-weight:500;color:var(--gold-2);letter-spacing:.02em;display:inline;vertical-align:.5em}
  .p-match{text-align:end}
  .p-match .big{justify-content:flex-end}
  .p-match .sub{white-space:normal;line-height:1.4;max-width:100%;font-size:clamp(11px,.88vw,17px)}
  .p-match .sub.when{font-size:clamp(10px,.78vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* under «بعد …», a step smaller, one line */

  .mrow{display:flex;flex-direction:row;gap:1.6vw;align-items:flex-end;justify-content:flex-end;min-width:0}
  .mblock{text-align:end;flex:0 1 auto;min-width:0;max-width:100%}
  .mblock:not(:last-child){padding-inline-end:1.6vw;border-inline-end:1px solid rgba(var(--gold-rgb),.25)}
  .mrow:has(.mblock + .mblock) .big{font-size:clamp(18px,1.6vw,34px)}
  .mblock .big{justify-content:flex-end;min-width:0}
  .mrow.flip .mblock{animation:weekIn .5s ease both}
  .mrow.flip .mblock + .mblock{animation-delay:.08s}
  /* a followed team's game under way: its score big, «مباشر» and the minute under it */
  .mblock.lvb .big{font-size:clamp(30px,3.1vw,64px)}
  .mblock.lvb .sc{color:var(--gold-hi);font-size:1.12em}
  .mblock.lvb .sub{font-size:clamp(15px,1.35vw,28px);color:#E6DCC4}
  .mblock .big > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    padding-bottom:.3em;margin-bottom:-.3em;    /* room for the dots under ي, ج… */
    padding-inline:.15em;margin-inline:-.15em;max-width:calc(100% + .3em)}  /* and for a final ر or ن past the ends */
  .none-week{font-size:clamp(26px,2.5vw,54px);font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;color:#A79C85}

  /* A new photo settles in over a minute, then holds still: an endless drift kept the TV redrawing
     the whole screen 60 times a second, for hours. */
  @keyframes settle{
    from{transform:scale(1.055) translate3d(-.55%,-.4%,0)}
    to{transform:scale(1.03) translate3d(0,0,0)}
  }
  @media (prefers-reduced-motion:no-preference){.photo.settle{animation:settle 60s ease-out both}}

  /* ===== top left: weather and markets, set like the date block on the right (no boxes) ===== */
  .markets{text-align:end;flex-shrink:0}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:flex-end;line-height:1.3;
    font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxd.dust{color:#E8B86A}
  .wxsub{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(214,175,107,.7)}
  .wxt:empty,.wxd:empty,.wxr:empty{display:none}
  .rule.l{margin-inline-start:auto;margin-inline-end:0;background:linear-gradient(90deg,var(--gold),rgba(var(--gold-rgb),0))}
  .mk{margin-top:1.2vh;display:flex;justify-content:flex-end;gap:1.6em;white-space:nowrap;
    font-size:clamp(12px,1.06vw,21px);font-weight:400;color:#D8CDB6}
  .mk .m{display:inline-flex;align-items:baseline;gap:.45em}
  .mk .delta{font-size:.72em}
  .mk .delta.up{color:#79D6A0}
  .mk .delta.down{color:#EE8B70}
  .mk.px .px{font-variant-numeric:tabular-nums;color:#F6EEDC}
  .mk.px .px[data-u]::after{content:' ' attr(data-u);font-size:.7em;color:#A79C85}
  .mk.px.g{display:grid;grid-template-columns:repeat(2,max-content);width:max-content;gap:.5vh 1.6em}
  .mkup{margin-top:.6vh;text-align:end;font-size:clamp(10px,.82vw,16px);font-weight:300;color:var(--dim);white-space:nowrap}
  .p-prayer.now .big{color:var(--gold-hi);text-shadow:0 0 40px rgba(var(--gold-rgb),.45)}
  .p-prayer.now .label{color:#F1CF8A}
  .live{color:#EE8B70;font-weight:500}
  /* the bar before the adhan: slim, at the very top, across the screen; the header starts below it (3.1vh) */
  .adbar{position:fixed;left:0;right:0;top:0;height:2.9vh;min-height:16px;z-index:6;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(90deg,rgba(var(--gold-rgb),0),rgba(var(--gold-rgb),.34) 30%,rgba(var(--gold-rgb),.34) 70%,rgba(var(--gold-rgb),0));
    color:var(--gold-hi);font-size:clamp(11px,1.1vw,21px);font-weight:500;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
  .adbar[hidden]{display:none}
  html.widget .adbar{display:none}
  .dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity 6s linear}
  .stage{transition:transform 3s ease}
  .sc{color:var(--gold-3);letter-spacing:.02em}

  /* #slot=none: the left panel is gone and the other two share the row */
  html.slot-none .p-match{display:none}
  html.slot-none .bottom{grid-template-columns:1fr .9fr}

  @media (max-aspect-ratio:5/4){
    .top{flex-direction:column-reverse;gap:1.4vh}
    .bottom{grid-template-columns:1fr 1fr}
    .p-match{grid-column:1/-1;text-align:start}
    .mrow{align-items:flex-start}
  }

  /* ===== LTR (en/fr/es): the page mirrors; these few things keep their own direction ===== */
  [dir=ltr] .clock .ampm{order:4;align-self:baseline;margin-top:0;margin-inline-start:.25em;margin-inline-end:0}
  [dir=ltr] .rule{background:linear-gradient(90deg,var(--gold),rgba(var(--gold-rgb),0))}
  [dir=ltr] .rule.l{background:linear-gradient(270deg,var(--gold),rgba(var(--gold-rgb),0))}
  [dir=ltr] .subline{letter-spacing:.08em}
  [dir=ltr] .panel .label{letter-spacing:.08em}
  [dir=ltr] .week .hd{letter-spacing:.08em}
  [dir=ltr] .top-veil{left:auto;right:0;background:radial-gradient(120% 100% at 100% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%)}
</style>

<body>
<div class="photo"></div>
<div id="credit"></div>
<div class="veil"></div>
<div class="grain"></div>
<div class="top-veil"></div>
<div class="bottom-veil"></div>
<div class="dimmer" id="dimmer"></div>
<div class="adbar" id="adbar" hidden></div>

<main class="stage">

  <header class="top">
    <div class="dates">
      <div class="hijri" id="hijri">—</div>
      <div class="greg" id="greg">—</div>
      <div class="natline" id="natline" hidden></div>
      <div class="rule"></div>
    </div>

    <div class="markets">
      <div class="wxline"><span class="wxt" id="wx-temp"></span><span class="wxd" id="wx-desc"></span></div>
      <div class="wxsub"><span id="wx-city">الرياض</span><span class="wxr" id="wx-range"></span></div>
      <div class="rule l"></div>
      <div class="mk">
        <span class="m"><span data-i18n="market.tasi">تاسي</span><span id="tasi-chg" class="delta" hidden></span></span>
        <span class="m"><span>S&amp;P 500</span><span id="spx-chg" class="delta" hidden></span></span>
        <span class="m"><span data-i18n="market.btc">بيتكوين</span><span id="btc-chg" class="delta" hidden></span></span>
      </div>
    </div>
  </header>

  <section class="mid">
    <div class="clockwrap">
      <div class="clock">
        <span class="ampm" id="ck-ap">—</span><span class="d" id="ck-h">--</span><span class="sep">:</span><span class="d" id="ck-m">--</span>
      </div>
      <div class="subline"><span class="dot"></span><span id="clock-sub">بتوقيت الرياض</span></div>
    </div>

    <div class="week">
      <span class="frm"></span><span class="dia t"></span><span class="dia b"></span>
      <div class="hd" id="week-hd" data-i18n="week.this">هذا الأسبوع</div>
      <ul id="week-list"><li class="empty" data-i18n="week.loading">جارٍ التحميل…</li></ul>
    </div>
  </section>

  <footer class="bottom">
    <div class="panel p-prayer">
      <div class="label" id="prayer-label" data-i18n="prayer.next">الصلاة القادمة</div>
      <div class="big"><span id="prayer-name">—</span><span class="num" id="prayer-time"></span></div>
      <div class="sub" id="prayer-count">—</div>
    </div>

    <div class="panel p-mid">
      <div class="label" id="occ-label" data-i18n="occ.placeholder">رمضان ١٤٤٨</div>
      <div class="big"><span class="num" id="occ-days">—</span></div>
      <div class="sub" id="occ-sub">—</div>
    </div>

    <div class="panel p-match">
      <div class="label" id="slot-label" data-i18n="slot.matches">المباريات</div>
      <div class="mrow" id="match-row">
        <div class="none-week" data-i18n="match.noneWeek">لا شيء هذا الأسبوع</div>
      </div>
    </div>
  </footer>

</main>

<script>
// daily background: one photo per Riyadh day, deterministic
const BGS = [
__BG_SET__
];
// the app passes the chosen city in the URL fragment: #city=..&lat=..&lon=..&tz=..
const _Q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const _list = k => (_Q.get(k) || '').split(',').map(x=>x.trim()).filter(Boolean);
const _num = (k, d) => { const v = parseFloat(_Q.get(k)); return isNaN(v) ? d : v; };
// the city's time zone, #tz=: the clock, prayers, matches and dates all go by it; one this browser does not know is Riyadh
const _tzOk = z => { try{ new Intl.DateTimeFormat('en',{timeZone:z}); return true; }catch(e){ return false; } };
// the interface language: #lang=ar|en|fr|es, set on <html> by the script in <head>; Arabic unless the app says otherwise.
// The dictionary is built in by src/build.py (src/i18n.json), and a missing key falls back to Arabic, never to a blank.
const LANGS = ['ar', 'en', 'fr', 'es'];
const LANG = LANGS.includes(document.documentElement.lang) ? document.documentElement.lang : 'ar';
const RTL = LANG === 'ar';
const I18N = __I18N__;
const T = I18N[LANG] || I18N.ar;
const t = (k, v) => {
  let s = T[k] != null ? T[k] : (I18N.ar[k] != null ? I18N.ar[k] : k);
  if(v) for(const key of Object.keys(v)) s = s.split('{' + key + '}').join(v[key]);
  return s;
};
// the app sends the city in Arabic (the settings are Arabic until the next step); the Latin page reads it in Latin.
const CITY_LAT = {
  'الرياض':'Riyadh', 'جدة':'Jeddah', 'مكة المكرمة':'Makkah', 'المدينة المنورة':'Madinah', 'الدمام':'Dammam',
  'الخبر':'Khobar', 'الظهران':'Dhahran', 'الأحساء':'Al Ahsa', 'الهفوف':'Hofuf', 'الطائف':'Taif', 'أبها':'Abha',
  'خميس مشيط':'Khamis Mushait', 'بريدة':'Buraidah', 'عنيزة':'Unaizah', 'حائل':'Hail', 'تبوك':'Tabuk',
  'جيزان':'Jazan', 'نجران':'Najran', 'الباحة':'Al Baha', 'ينبع':'Yanbu', 'الجبيل':'Jubail', 'عرعر':'Arar',
  'سكاكا':'Sakaka', 'القصيم':'Qassim', 'الخرج':'Al Kharj', 'حفر الباطن':'Hafar Al-Batin', 'بيشة':'Bisha',
};
const cityName = c => RTL ? c : (CITY_LAT[c] || c);
// the cards a slot can show (Prefs.PANELS in the app is the same list); «none» is the absence of one
const CARD_KINDS = ['shows','prayers','forecast','hourly','prayerrow','matches','verse','wisdom','adhkar','stocks','tasks','year','smart','today'];
const CONFIG = {
  city: cityName(_Q.get('city') || (RTL ? 'الرياض' : 'Riyadh')),
  latitude: _num('lat', 24.7136),
  longitude: _num('lon', 46.6753),
  timezone: _tzOk(_Q.get('tz') || 'Asia/Riyadh') ? (_Q.get('tz') || 'Asia/Riyadh') : 'Asia/Riyadh',
  prayerMethod: 4,
  // followed teams in priority order: #teams=id,id,... (up to 20); older builds send team1/team2
  teamIds: (_Q.has('teams') ? _Q.get('teams').split(',')
            : [_Q.has('team1') ? _Q.get('team1') : '136013', _Q.has('team2') ? _Q.get('team2') : '136137'])
    .map(x=>(x||'').trim()).filter(x=>/^\d+$/.test(x)).slice(0, 20),
  sportsKey: '123',
  // whole leagues: #leagues=Saudi-Arabian Pro League,NBA (default none; up to 5): every game of every club in them
  leagues: _list('leagues').filter(x => /^[A-Za-z0-9 \-]{2,40}$/.test(x)).slice(0, 5),
  // other sports beside the teams' games: #events=f1,ufc,boxing (default none)
  events: _list('events').filter(k => ['f1','ufc','boxing'].includes(k)),
  eventWindowDays: 14,
  // the card beside the clock: one of CARD_KINDS or none (#week=0 from older builds = none)
  panel: (p => CARD_KINDS.includes(p) || p === 'none' ? p : 'verse')
         (_Q.get('panel') || (_Q.get('week') === '0' ? 'none' : 'verse')),
  // #tasks=: the open tasks, one per line (the app drops done ones), at most 12 of 60 characters
  tasks: (_Q.get('tasks') || '').split('\n').map(x=>x.trim().slice(0, 60)).filter(Boolean).slice(0, 12),
  matchesPerPage: 2,
  matchPageMs: 15000,
  matchPageFastMs: 10000,   // the page turn once a followed league makes more than 3 pages
  // minutes from adhan to iqama (Ministry of Islamic Affairs defaults); Friday Dhuhr has none
  iqama: {Fajr:25, Dhuhr:20, Asr:20, Maghrib:10, Isha:20},
  // "new this week" filters from the app: TVMaze genres, languages, countries, picked show ids
  shows: {
    genres: _list('genres'),
    langs: _list('langs'),
    ids: _list('shows').filter(x=>/^\d+$/.test(x)).slice(0, 30),
    countries: _list('countries').length ? _list('countries') : ['US'],
    minRating: _num('minrating', 7),
  },
  weekWindowDays: 7,
  // minutes between background photos: #photos=5|10|15|30|60 (anything else = 30)
  photoMinutes: (m => [5,10,15,30,60].includes(m) ? m : 30)(_num('photos', 30)),
  // the owner's own photos («صوري»): #own=how many (0-10) and #ownmode=mix (join ours, the default) or only
  own: Math.max(0, Math.min(10, Math.floor(_num('own', 0)))),
  ownMode: _Q.get('ownmode') === 'only' ? 'only' : 'mix',
  // digits everywhere: #digits=hindi (١٢٣), latin (123), or auto (the default: Arabic -> hindi, other languages -> latin);
  // an explicit choice wins in any language, so Arabic can be shown with 123
  digits: (d => d === 'hindi' || d === 'latin' ? d : (RTL ? 'hindi' : 'latin'))(_Q.get('digits')),
  // the look of the card beside the clock: #cardstyle=current|dark1|glass1|dark3|glass3 (anything else = current)
  cardStyle: (v => ['dark1','glass1','dark3','glass3'].includes(v) ? v : 'current')(_Q.get('cardstyle')),
  // the markets at the top left: #markets=tasi,spx,btc (up to 4 of tasi aramco spx btc gold silver xrp; anything else = the default)
  // and #mkstyle=arrows (a ▲/▼ only, the default) or prices (the price and the day's change)
  markets: (l => l.length ? l : ['tasi','spx','btc'])(
    _list('markets').filter((k, i, a) => ['tasi','aramco','spx','btc','gold','silver','xrp'].includes(k) && a.indexOf(k) === i).slice(0, 4)),
  mkStyle: _Q.get('mkstyle') === 'prices' ? 'prices' : 'arrows',
  // the national days (23 September, 22 February): #national=auto (the default) or off
  national: _Q.get('national') === 'off' ? 'off' : 'auto',
  // the stocks card's watchlist: #stocks=2222,1120,AAPL,NVDA (up to 8; 4 digits = a Tadawul code, letters = a US ticker)
  stocks: _list('stocks').map(x => x.toUpperCase()).filter((x, i, a) => /^(\d{4}|[A-Z][A-Z.\-]{0,5})$/.test(x) && a.indexOf(x) === i).slice(0, 8),
  // the bottom-left slot: #slot=matches|weather|fasting|countdown|none (anything else = matches)
  slot: (v => ['weather','fasting','countdown','markets','none'].includes(v) ? v : 'matches')(_Q.get('slot')),
  // #cd=YYYY-MM-DD&cdname=...: the date and name for slot=countdown (a bad date = none)

// every number on the screen goes through ar() or a formatter built on NU, so CONFIG.digits decides them all
const LATIN = CONFIG.digits === 'latin', NU = LATIN ? 'latn' : 'arab';
// the percent sign follows the digits, not the language: ٪ with Hindi digits, % with Latin ones
const PCT = LATIN ? '%' : t('market.percent');
const GREG = LANG + '-u-ca-gregory-nu-' + NU;
const HIJRI = LANG + '-u-ca-islamic-umalqura-nu-' + NU;
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => LATIN ? String(s) : String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

function riyadhParts(d = new Date()){
  const f = new Intl.DateTimeFormat('en-GB',{
    timeZone: CONFIG.timezone, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
// how far the city's clock is ahead of UTC at that moment, in ms (Riyadh +3 h all year; Cairo changes with summer time)
function tzOffsetMs(ms){
  const p = riyadhParts(new Date(ms));
  return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(ms / 1000) * 1000;
}
function fmt12(h, mi){
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ar(h12)}:${ar(pad(mi))} ${t(h < 12 ? 'am' : 'pm')}`;
}

// An identical write still restyles and repaints, so the timers below write only what changed.
function setText(el, v){ if(el.textContent !== v) el.textContent = v; }
function setHTML(el, h, force){ if(force || el.__h !== h){ el.__h = h; el.innerHTML = h; return true; } return false; }
// the labels written in the HTML keep their Arabic as the no-JS fallback; this swaps them for the page's language
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => setText(el, t(el.getAttribute('data-i18n'))));
}

function tickClock(){
  const p = riyadhParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const key = h12 + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(ar(h12));
  document.getElementById('ck-m').innerHTML = digits(ar(pad(p.mi)));
  setText(document.getElementById('ck-ap'), t(p.h < 12 ? 'am' : 'pm'));
}

// National Day (23 September, shown 21-25) and Founding Day (22 February, shown 20-24), by the Riyadh date.
// n = the year count shown; today = the day itself. Null when off or outside the days.
const NATIONAL = [
  {mo:9, d:23, key:'national', since:1930},
  {mo:2, d:22, key:'founding', since:1727},
];
function nationalNow(){
  if(CONFIG.national === 'off') return null;
  const p = riyadhParts();
  for(const e of NATIONAL){
    const diff = Math.round((Date.UTC(p.y, p.mo-1, p.d) - Date.UTC(p.y, e.mo-1, e.d)) / 86400000);
    if(Math.abs(diff) <= 2) return {...e, today: diff === 0, n: p.y - e.since};
  }
  return null;
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
let PRAYERS = [];

let DAY_TIMES = null;
function buildPrayers(times){
  DAY_TIMES = times;
  PRAYERS = PRAYER_KEYS.map(k=>{

// Umm al-Qura: Fajr at 18.5°, Maghrib at sunset, Isha 90 min after Maghrib (120 in Ramadan),
// Asr at shadow factor 1. Same method as Aladhan's method 4, so the offline times match to a minute or two.
function computePrayers(){
  const p = riyadhParts(), lat = CONFIG.latitude, lng = CONFIG.longitude;
  const tz = Math.round((Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - Date.now()) / 60000) / 60;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) /
                            (Math.cos(rad(d))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const fajr = adj(angleTime(18.5, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(.833, 18, false));
  const isha = maghrib + (hijriMonthNow() === 9 ? 120 : 90)/60;
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  return {Fajr:hm(fajr), Sunrise:hm(sunrise), Dhuhr:hm(dhuhr), Asr:hm(asr), Maghrib:hm(maghrib), Isha:hm(isha)};
}

async function loadPrayers(){
  const p = riyadhParts();
  const url = `https://api.aladhan.com/v1/timings/${pad(p.d)}-${pad(p.mo)}-${p.y}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(url, 12000);
    const j = await r.json();
    if(!j?.data?.timings?.Fajr) throw 0;
    buildPrayers(j.data.timings);
  }catch(e){
    try{ buildPrayers(computePrayers()); }catch(_){}
  }
  tickPrayer();
  tickOccasion();   // Ramadan mode needs the prayer times
  renderPanel(false, 'prayers', 'adhkar', 'prayerrow');
}

// Arabic keeps its dual and its 3-10 / 11+ forms (the wording the screen always had); the Latin languages use
// Intl.PluralRules, so English, French and Spanish each get their own singular and plural.
function qty(n, u){
  if(RTL){
    if(n === 2) return T['unit.' + u + '.two'];
    if(n >= 3 && n <= 10) return ar(n) + ' ' + T['unit.' + u + '.few'];
    return ar(n) + ' ' + T['unit.' + u + '.many'];
  }
  const form = new Intl.PluralRules(LANG).select(n);
  return ar(n) + ' ' + t('unit.' + u + '.' + form);
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,'hour'));
  if(m || !h) out.push(qty(m,'min'));
  return out.join(t('join'));
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,'day'));
  if(h && out.length < 2) out.push(qty(h,'hour'));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), 'min'));
  return out.join(t('join'));
}

function isFriday(){
  return new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? t('prayer.Jumuah') : x.name; }

// ---- the bar before the adhan: in the last 10 minutes before each prayer «الأذان بعد ٨ دقائق», from the adhan to the iqama
// «الإقامة بعد ١٢ دقيقة» (the iqama minutes of CONFIG.iqama, none for a Friday's Dhuhr). #adhanbar=0 turns it off.
const ADHAN_BAR_MIN = 10;
function adhanBarText(){
  if(!CONFIG.adhanBar || !PRAYERS.length) return '';
  const p = riyadhParts(), mins = p.h*60 + p.mi + p.s/60;
  for(const x of PRAYERS){
    const at = x.h*60 + x.mi, toAdhan = at - mins;
    if(toAdhan > 0 && toAdhan <= ADHAN_BAR_MIN) return t('prayer.adhanAfter') + ' ' + humanRemaining(Math.max(60, Math.ceil(toAdhan)*60));
    const gap = x.key === 'Dhuhr' && isFriday() ? 0 : (CONFIG.iqama[x.key] || 0);
    if(mins >= at && mins < at + gap) return t('prayer.iqamaAfter') + ' ' + humanRemaining(Math.max(60, Math.ceil(at + gap - mins)*60));
  }
  return '';
}
function tickAdhanBar(){
  const bar = document.getElementById('adbar'), t = adhanBarText();
  if(!bar) return;
  bar.hidden = !t;
  if(t) setText(bar, t);
}

function tickPrayer(){
  tickAdhanBar();
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;

  // between adhan and iqama: show the iqama countdown
  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    if(!panel.classList.contains('now')) panel.classList.add('now');
    setText(elL, t('prayer.now'));
    setText(elN, prayerName(cur));
    setText(elT, fmt12(cur.h, cur.mi));
    setHTML(elC, t('prayer.iqamaAfter') + ' <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>');
    return;
  }

  if(panel.classList.contains('now')) panel.classList.remove('now');
  setText(elL, t('prayer.next'));
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  setText(elN, prayerName(next));
  setText(elT, fmt12(next.h, next.mi));
  setHTML(elC, t('prayer.after') + ' <b>' + humanRemaining(Math.max(0, Math.round(leftM*60))) + '</b>');
}

// ---- «المناسبة القادمة»: the card in the middle of the bottom row follows the Hijri year ----
// All the wording is here. hm/hd: the Hijri month and day it begins (Umm al-Qura); days: how long it lasts;
// name: the label; year: the Hijri year follows the name; today: the big text on its days;
// note: a small second line while counting down. Ramadan itself shows iftar and suhoor (see tickOccasion).
const OCCASIONS = [
  {hm:9,  hd:1,  days:30, key:'ramadan',      year:true},
  {hm:10, hd:1,  days:3,  key:'eid_fitr'},
  {hm:12, hd:1,  days:1,  key:'dhul_hijjah'},
  {hm:12, hd:9,  days:1,  key:'arafah'},
  {hm:12, hd:10, days:4,  key:'eid_adha'},
  {hm:1,  hd:1,  days:1,  key:'newyear'},
  {hm:1,  hd:10, days:1,  key:'ashura'},
];

// Today's occasion, or the next one with the days left and its day: one pass over the coming year, once a day.
let OCC_CACHE = {day:'', val:null};
function occasionNow(){
  const dayKey = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(OCC_CACHE.day === dayKey) return OCC_CACHE.val;
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric',month:'numeric',day:'numeric'});
  const hijri = d => fmt.formatToParts(d).reduce((a,x) => (a[x.type] = +x.value.replace(/[^0-9]/g,''), a), {});
  const base = Date.now();
  let val = null, found = {};
  for(let i = 0; i < 400 && !val; i++){
    const d = new Date(base + i*86400000), h = hijri(d);
    if(i === 0){
      const o = OCCASIONS.find(o => h.month === o.hm && h.day >= o.hd && h.day < o.hd + o.days);
      if(o){ val = {o, today:true, hy:h.year}; break; }
    }
    OCCASIONS.forEach(o => {
      if(i > 0 && h.month === o.hm && h.day === o.hd && !found[o.key]){
        const p = riyadhParts(d);
        found[o.key] = {o, days:i, hy:h.year, y:p.y, mo:p.mo, d:p.d};
      }
    });
    if(Object.keys(found).length === OCCASIONS.length) break;
  }
  if(!val) val = Object.values(found).sort((a, b) => a.days - b.days)[0] || null;
  OCC_CACHE = {day: dayKey, val};
  return val;
}

function hijriMonthNow(){
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 0; }
}
function tickOccasion(){
  const elL=document.getElementById('occ-label'),
        elD=document.getElementById('occ-days'),
        elS=document.getElementById('occ-sub');

  // ---- the national day itself: a greeting instead of the countdown ----
  const nat = nationalNow();
  if(nat && nat.today){
    setText(elL, t(nat.key + '.short'));
    setHTML(elD, '<span class="txt">' + esc(t(nat.key + '.greeting')) + '</span>');
    setText(elS, '');
    return;
  }

  // ---- Ramadan mode: iftar / suhoor instead of the countdown ----
  if(hijriMonthNow() === 9 && PRAYERS.length){
    const rp = riyadhParts();
    const mins = rp.h*60 + rp.mi + rp.s/60;
    const fajr = PRAYERS.find(p=>p.key==='Fajr');
    const maghrib = PRAYERS.find(p=>p.key==='Maghrib');
    const fajrM = fajr.h*60 + fajr.mi, maghribM = maghrib.h*60 + maghrib.mi;
    let label, targetM;
    if(mins < fajrM){ label = t('ramadan.imsak'); targetM = fajrM; }
    else if(mins < maghribM){ label = t('ramadan.iftar'); targetM = maghribM; }
    else { label = t('ramadan.imsak'); targetM = fajrM + 1440; }
    const th = Math.floor((targetM % 1440) / 60), tm = targetM % 60;
    setText(elL, label);
    setHTML(elD, ar(th%12===0?12:th%12) + ':' + ar(String(tm).padStart(2,'0'))
                  + ' <span class="unit">' + t(th < 12 ? 'am' : 'pm') + '</span>');
    setHTML(elS, t('prayer.after') + ' <b>' + humanRemaining(Math.max(0, Math.round((targetM - mins)*60))) + '</b>');
    return;
  }

  // ---- the occasion's day, or the countdown to the next one ----
  const oc = occasionNow();
  if(!oc){ setText(elL, ''); setText(elD, '—'); setText(elS, ''); return; }
  const o = oc.o;
  setText(elL, t('occ.' + o.key + '.name') + (o.year ? ' ' + ar(oc.hy) : ''));
  if(oc.today){
    setHTML(elD, '<span class="txt">' + esc(t('occ.' + o.key + '.today')) + '</span>');
    setText(elS, '');
    return;
  }
  setHTML(elD, ar(oc.days) + ' <span class="unit">' + t(oc.days === 1 ? 'occ.unit.one' : 'occ.unit.other') + '</span>');
  setHTML(elS, esc(new Intl.DateTimeFormat(GREG,{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'})
      .format(new Date(Date.UTC(oc.y, oc.mo-1, oc.d, 12))).replace('،','') + ' · ' + t('occ.expected'))
    + (T['occ.' + o.key + '.note'] ? '<div class="note">' + esc(t('occ.' + o.key + '.note')) + '</div>' : ''));
}

const TL_LETTERS = {a:'إيه',b:'بي',c:'سي',d:'دي',e:'إي',f:'إف',g:'جي',h:'إتش',i:'آي',j:'جيه',k:'كيه',l:'إل',m:'إم',

function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',

  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');   // CP, PSG
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }                         // short or silent e
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

let arQueue = Promise.resolve();
function arName(en, kind, id){
  if(!RTL) return kind === 'team' && id && TEAM_BY_ID_EN[id] ? TEAM_BY_ID_EN[id] : String(en || '').trim();
  if(kind === 'team' && id && TEAM_BY_ID[id]) return TEAM_BY_ID[id];
  en = String(en || '').trim();
  if(!en || hasArabic(en)) return en;
  if(kind === 'team'){
    const k = TEAM_KEYS[teamKey(en)];
    if(k) return k;
  }
  const key = kind + ':' + en;
  if(AR_NAMES[key] !== undefined) return AR_NAMES[key] || translit(en);
  if(!AR_PENDING.has(key)){
    AR_PENDING.add(key);
    arQueue = arQueue.then(async ()=>{            // one lookup at a time
      try{
        AR_NAMES[key] = await wikidataArabic(en, kind);   // '' = Wikidata has none: keep the transliteration
        try{ localStorage.setItem('arNames', JSON.stringify(AR_NAMES)); }catch(e){}
        if(AR_NAMES[key]){ renderMatches(); renderPanel(false, 'matches'); }
      }catch(e){}                                    // offline: try again next time
      AR_PENDING.delete(key);
    });
  }
  return translit(en);
}
const teamAr = (s, id) => arName(s, 'team', id);

async function fetchNext(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventsnext.php?id=${id}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  if(j?.events) NEXT_LIST[id] = j.events;
  return (j?.events || [])[0] || null;
}
function toDate(ev){
  const s = ev.strTimestamp || `${ev.dateEvent}T${ev.strTime || '00:00:00'}`;
  return new Date(s.endsWith('Z') ? s : s+'Z');
}

// one slot per picked team: a result from the last 24h, else a fixture this week, else hidden
// A game is over once its status says so, or 2.5 h after kick-off; its score stays up for a day after that.
const FINAL = ['FT','AET','PEN','MATCH FINISHED'];
// how long a game lasts, by sport, before it counts as over without a final status
const DUR_H = {Soccer:2.5, Basketball:3, 'American Football':3.75};
const durMs = ev => (DUR_H[ev.strSport] || 2.5) * 3600000;
function finishedRecently(ev, now){
  if(!ev || ev.intHomeScore == null || ev.intAwayScore == null) return false;
  const k = toDate(ev).getTime(), end = k + durMs(ev);
  const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= k : now >= end;
  return over && now - end < 86400000;
}
// Keep a score seen at the final whistle: the free API's "last games" list can lag, and "next game"
// moves on to the following fixture right away. Saved, so a restart within the day still shows it.
const KEPT = (()=>{ try{ return JSON.parse(localStorage.getItem('keptResults') || '{}'); }catch(e){ return {}; } })();
function keepResult(id, ev){
  if(!finishedRecently(ev, Date.now())) return;
  KEPT[id] = [ev, ...(KEPT[id] || []).filter(x => x.idEvent !== ev.idEvent && finishedRecently(x, Date.now()))];
  try{ localStorage.setItem('keptResults', JSON.stringify(KEPT)); }catch(e){}
}
function resultsFor(id){
  const seen = new Set();
  return [...(RESULTS[id] || []), ...(KEPT[id] || []), MATCHES[id]]
    .filter(ev => ev && ev.idEvent && !seen.has(ev.idEvent) && seen.add(ev.idEvent));
}

// «السبت ٢٤ أكتوبر · ٩:١٦ م»: the small line under an upcoming game, in the slot and in the card beside the clock
function matchWhen(d){
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long',day:'numeric',month:'long'}).format(d).replace('،','')
    + ' · ' + fmt12(+p.hour % 24, +p.minute);
}

// the final score of a finished game: «الهلال 2 - 1 النصر» and «النتيجة النهائية · السبت»
function resultBlock(done){
  const day = new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(toDate(done));
  return `<div class="mblock">`
    + `<div class="big"><span><span class="tm">${esc(teamAr(done.strHomeTeam, done.idHomeTeam))}</span> <span class="sc">${ar(+done.intHomeScore)} - ${ar(+done.intAwayScore)}</span> <span class="tm">${esc(teamAr(done.strAwayTeam, done.idAwayTeam))}</span></span></div>`
    + `<div class="sub">${t('match.result')} · ${day}</div></div>`;
}
// a game under way or due within the week; '' for any other
function gameBlock(ev, now, big){
  const home = esc(teamAr(ev.strHomeTeam, ev.idHomeTeam)), away = esc(teamAr(ev.strAwayTeam, ev.idAwayTeam));
  const d = toDate(ev), diff = d - now;
  if(diff < -durMs(ev) || diff > CONFIG.weekWindowDays * 86400000) return '';   // in progress stays on screen
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const t12 = ar(fmt12(+p.hour % 24, +p.minute));
  const live = diff <= 0 && ev.intHomeScore != null && ev.intAwayScore != null;
  // «بعد ٣ أيام» and under it the date and time, small: «السبت ٢٤ أكتوبر · ٩:١٦ م»
  const dateLine = matchWhen(d);
  const sub = diff > 0 ? `${t('prayer.after')} ${shortRemaining(diff)}</div><div class="sub when">${dateLine}` : `<span class="live">${t('match.live')}</span> · ${liveStatus(ev, t12)}`;
  const mid = live ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : t('match.vs');
  return `<div class="mblock${big ? ' lvb' : ''}">`
       + `<div class="big"><span><span class="tm">${home}</span>${mid}<span class="tm">${away}</span></span></div>`
       + `<div class="sub">${sub}</div>`
       + `</div>`;
}
// -> {t, html} or null. t (kick-off) puts a league's games and the teams' in one time order.
function matchSlot(id, now, shown){
  const done = resultsFor(id).filter(ev => finishedRecently(ev, now)).sort((a,b)=>toDate(b)-toDate(a))[0];
  if(done){
    if(shown.has(done.idEvent)) return null;          // both teams in the same game
    shown.add(done.idEvent);
    return {t: toDate(done).getTime(), html: resultBlock(done)};
  }
  const ev = MATCHES[id];
  if(!ev || shown.has(ev.idEvent)) return null;
  const html = gameBlock(ev, now);
  if(!html) return null;
  shown.add(ev.idEvent);
  return {t: toDate(ev).getTime(), html};
}

// ---------- whole leagues: #leagues= ----------
// CI writes each league's games of the coming week and the last day into one small file (.github/tools/league_fixtures.py,
// branch data-leagues); the page downloads one file per followed league every 30 minutes and no more: that is the
// whole cost of a league, however many clubs it has. A game in progress is refreshed by lookupevent.php like a followed
// team's (loadLive), at most LEAGUE_LIVE_MAX of them at a time.
const LEAGUE_BASE = 'https://raw.githubusercontent.com/tshi-dev/UrTV/data-leagues/leagues/';
const LEAGUE_LIVE_MAX = 6;
const leagueSlug = n => String(n).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');   // team_ids.slug()
let LEAGUE_DATA = (()=>{ try{ return JSON.parse(localStorage.getItem('leagueData') || '{}') || {}; }catch(e){ return {}; } })();   // name -> its file
let LIVE_PATCH = {};   // idEvent -> {at, ev}: lookupevent's newer word on a game, used while newer than the league's file
async function loadLeagues(){
  let got = 0;
  await Promise.all(CONFIG.leagues.map(async name => {
    try{
      const r = await fetchT(LEAGUE_BASE + leagueSlug(name) + '.json', 12000);
      if(!r.ok) return;
      const j = await r.json();
      if(j && Array.isArray(j.events)){ LEAGUE_DATA[name] = {updated: j.updated, events: j.events}; got++; }
    }catch(e){}
  }));
  if(got) try{ localStorage.setItem('leagueData', JSON.stringify(LEAGUE_DATA)); }catch(e){}
  return got;
}
// every game of the followed leagues, once each (two leagues can list one game), with a live update laid over the file's
function leagueGames(){
  const seen = new Set(), out = [];
  CONFIG.leagues.forEach(name => {
    const d = LEAGUE_DATA[name];
    if(!d) return;
    const at = Date.parse(d.updated) || 0;
    (d.events || []).forEach(ev => {
      if(!ev || !ev.idEvent || seen.has(ev.idEvent) || isNaN(toDate(ev))) return;
      seen.add(ev.idEvent);
      const p = LIVE_PATCH[ev.idEvent];
      out.push(p && p.at > at ? Object.assign({}, ev, p.ev) : ev);
    });
  });
  return out;
}
const CALLED_OFF = /^(CANC|POSTP|ABAN|SUSP|WO)/i;
// The league's games the screen shows: a result of the last day, a game under way, a game of the coming week.
// -> [{t, ev, done}] in time order; shown holds the ids already taken by a followed team, so no game appears twice.
function leagueShow(now, shown){
  return leagueGames().filter(ev => !CALLED_OFF.test(ev.strStatus || '') && !shown.has(ev.idEvent)).map(ev => {
    const done = finishedRecently(ev, now);
    const html = done ? resultBlock(ev) : FINAL.includes((ev.strStatus || '').toUpperCase()) ? '' : gameBlock(ev, now);
    return html ? {t: toDate(ev).getTime(), ev, done, html} : null;
  }).filter(Boolean).sort((a, b) => a.t - b.t);
}

function liveStatus(ev, t12){
  const st = (ev.strStatus || '').toUpperCase();
  if(st === 'HT') return t('match.ht');
  if(['FT','AET','PEN'].includes(st)) return t('match.ft');
  const m = parseInt(ev.strProgress, 10);
  return isNaN(m) || (ev.strSport && ev.strSport !== 'Soccer') ? t('match.started', {t:t12}) : t('match.minute', {n:ar(m)});   // minutes are football's
}

// while a picked team is playing, refresh that event every 2 minutes; so is a game of a followed league (a few at most)
async function loadLive(){
  const now = Date.now();
  let asked = false;
  const live = ev => { const k = toDate(ev).getTime(); return ev && ev.idEvent && now >= k - 5*60000 && now <= k + durMs(ev); };
  const own = new Set(Object.values(MATCHES).filter(Boolean).map(ev => ev.idEvent));   // already asked for as a team's
  const look = async ev => {
    asked = true;
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/lookupevent.php?id=${ev.idEvent}`, 10000);
      const j = await r.json();
      const fresh = (j.events || [])[0];
      return fresh && fresh.idEvent === ev.idEvent ? fresh : null;
    }catch(e){ return null; }
  };
  const theirs = CONFIG.leagues.length ? leagueGames().filter(ev => live(ev) && !own.has(ev.idEvent)).slice(0, LEAGUE_LIVE_MAX) : [];
  await Promise.all([
    ...Object.entries(MATCHES).map(async ([id, ev])=>{
      if(!live(ev)) return;
      const fresh = await look(ev);
      if(fresh){ MATCHES[id] = Object.assign({}, ev, fresh); keepResult(id, MATCHES[id]); }
    }),
    ...theirs.map(async ev => {
      const fresh = await look(ev);
      if(fresh) LIVE_PATCH[ev.idEvent] = {at: Date.now(), ev: fresh};
    }),
  ]);
  if(asked) renderMatches();   // outside a match window nothing was asked, nothing changed
}

// ---------- other sports: Formula 1, UFC, boxing (events, not teams) ----------
// Each has TheSportsDB leagues, found by CI (assets/shared/events.json); the next events of each are asked for every
// 30 minutes with the matches, and shown beside the followed teams' games: the event's name, not «فريق × فريق».
const EVENT_LEAGUES = __EVENTS__;
let EVENT_NEXT = {};   // key -> upcoming events, as the leagues answered
const EVENT_DUR_H = {f1:2.5, ufc:6, boxing:5};
const EVENT_TAG = {f1:'', ufc:'', boxing:t('event.boxing')};
const COUNTRY_AR = {'saudi arabia':'السعودية','bahrain':'البحرين','qatar':'قطر','united arab emirates':'الإمارات','uae':'الإمارات',
  'australia':'أستراليا','japan':'اليابان','china':'الصين','united states':'الولايات المتحدة','usa':'الولايات المتحدة',
  'italy':'إيطاليا','monaco':'موناكو','canada':'كندا','spain':'إسبانيا','austria':'النمسا','united kingdom':'بريطانيا',
  'great britain':'بريطانيا','england':'بريطانيا','hungary':'المجر','belgium':'بلجيكا','netherlands':'هولندا',
  'azerbaijan':'أذربيجان','singapore':'سنغافورة','mexico':'المكسيك','brazil':'البرازيل','france':'فرنسا','germany':'ألمانيا',
  'portugal':'البرتغال','turkey':'تركيا','russia':'روسيا','south korea':'كوريا الجنوبية','malaysia':'ماليزيا','india':'الهند',
  'argentina':'الأرجنتين','egypt':'مصر','morocco':'المغرب'};
// the place in «X Grand Prix» as Arabic writes it (the country, or the city for Miami, Las Vegas, Monaco…)
const GP_AR = {'saudi arabian':'السعودية','saudi arabia':'السعودية','bahrain':'البحرين','australian':'أستراليا','japanese':'اليابان',
  'chinese':'الصين','miami':'ميامي','emilia romagna':'إميليا رومانيا','emilia-romagna':'إميليا رومانيا','monaco':'موناكو',
  'canadian':'كندا','spanish':'إسبانيا','barcelona':'إسبانيا','austrian':'النمسا','british':'بريطانيا','hungarian':'المجر',
  'belgian':'بلجيكا','dutch':'هولندا','italian':'إيطاليا','azerbaijan':'أذربيجان','singapore':'سنغافورة','united states':'الولايات المتحدة',
  'american':'الولايات المتحدة','mexico city':'مدينة المكسيك','mexican':'المكسيك','mexico':'المكسيك','sao paulo':'ساو باولو',
  'brazilian':'البرازيل','brazil':'البرازيل','las vegas':'لاس فيغاس','qatar':'قطر','abu dhabi':'أبوظبي','french':'فرنسا',
  'portuguese':'البرتغال','styrian':'ستيريا','70th anniversary':'الذكرى السبعين','eifel':'آيفل','turkish':'تركيا','russian':'روسيا'};
const SESSIONS = [[/sprint\s*(qualifying|shootout)/i, 'f1.sprintQuali'], [/sprint/i, 'f1.sprint'],
  [/(?:free\s*)?practice\s*(\d)|\bfp\s*(\d)/i, null], [/qualifying|\bquali\b/i, 'f1.quali'], [/race|grand prix/i, 'f1.race']];
const foldKey = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]+/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const arDigits = s => ar(s);
const trl = s => RTL ? String(s || '').split(/(\s+)/).map(w => /[A-Za-z]/.test(w) ? translit(w) : w).join('') : String(s || '');   // names of people

// one TheSportsDB event of league key -> {title, tag, country, t, dur, dateOnly}
// (F1: «United States Grand Prix Practice 1»; UFC: «UFC 333 Volkanovski vs Evloev», «UFC Fight Night 291 A vs B»;
// boxing: «Dalton Smith vs Alberto Puello», usually with no time of day: «00:00:00»)
function eventInfo(key, ev){
  const name = String(ev.strEvent || ev.strEventAlternate || '').trim();
  let title = '', session = '', head = '', pre = '', card = '';   // head: the slot's big line (HTML); pre: under it, small; card: the row beside the clock (HTML)
  if(key === 'f1'){
    const gp = name.match(/^(.*?)\s*grand prix/i);
    const place = gp ? foldKey(gp[1].replace(/\bformula\s*1\b/i,'').replace(/\b20\d\d\b/,'')) : '';
    const rest = name.replace(/^.*?grand prix/i,'');
    for(const [rx, label] of SESSIONS){
      const m = (rest || name).match(rx);
      if(!m) continue;
      session = label ? t(label) : t('f1.practice', {n: arDigits(m[1] || m[2] || '')});
      break;
    }
    if(!session) session = t('f1.race');
    const gpName = gp ? t('f1.gp', {place: RTL ? (GP_AR[place] || trl(gp[1].trim())) : gp[1].trim()}) : trl(name);
    title = gpName + ' · ' + session;
    // the session goes under it, so the big line stays short; tighter still: «جائزة السعودية»
    const gpShort = RTL ? gpName.replace(/ الكبرى$/, '') : gp[1].trim() + ' GP';
    head = gp ? `<span class="tm" data-short="${esc(gpShort)}">${esc(gpName)}</span>` : esc(gpName);
    pre = session;
    card = head + ' · ' + esc(session);
  }else{
    let prefix = '', rest = name;
    const u = key === 'ufc' ? name.match(/^UFC(\s+Fight\s+Night)?\s*(\d+)?\s*[:\-]?\s*(.*)$/i) : null;
    if(u){ prefix = 'UFC' + (u[1] ? ' ' + t('ufc.fightNight') : '') + (u[2] ? ' ' + arDigits(u[2]) : ''); rest = u[3]; }
    let pair = ev.strHomeTeam && ev.strAwayTeam ? [ev.strHomeTeam, ev.strAwayTeam] : rest.split(/\s+vs\.?\s+/i);
    const body = pair.length === 2 ? trl(pair[0]) + t('match.vs') + trl(pair[1]) : trl(rest);
    title = arDigits([prefix, body].filter(Boolean).join(' · '));
    // the fighters on the big line, each with the family name as the short form fitMatches may need
    const who = n => { const w = trl(n).trim(), last = w.split(/\s+/).pop();
      return `<span class="tm"${last !== w ? ` data-short="${esc(last)}"` : ''}>${esc(w)}</span>`; };
    head = arDigits(pair.length === 2 ? who(pair[0]) + t('match.vs') + who(pair[1]) : esc(body));
    pre = arDigits(prefix);
    card = [pre && esc(pre), head].filter(Boolean).join(' · ');
  }
  const c = foldKey(ev.strCountry);
  const country = RTL ? (COUNTRY_AR[c] || (c ? trl(ev.strCountry) : '')) : (c ? String(ev.strCountry) : '');
  const dateOnly = !ev.strTime || /^00:00(:00)?$/.test(ev.strTime);   // no time of day known: only the day is told
  let at = toDate(ev).getTime();
  if(dateOnly && !isNaN(at)) at -= tzOffsetMs(at);   // at is that day's midnight in UTC: it starts at midnight in the city's time zone
  return {title, head, pre, card, tag: EVENT_TAG[key], country: title.includes(country) ? '' : country, t: at,
          dur: dateOnly ? 24*3600000 : EVENT_DUR_H[key] * 3600000, dateOnly};
}
// the events of key still to come (or running) within the window, soonest first
function eventsOf(key, now){
  const over = e => /^(FT|AET|PEN|FINISHED|MATCH FINISHED|CANCELLED|POSTPONED)$/i.test(e.strStatus || '');
  return (EVENT_NEXT[key] || []).filter(e => e && e.idEvent && !over(e))
    .map(e => ({e, i: eventInfo(key, e)}))
    .filter(x => !isNaN(x.i.t) && now < x.i.t + x.i.dur && x.i.t - now <= CONFIG.eventWindowDays * 86400000)
    .sort((a, b) => a.i.t - b.i.t);
}
function eventWhen(i, now){
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(new Date(i.t)).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const t12 = i.dateOnly ? '' : ar(fmt12(+p.hour % 24, +p.minute));
  const sameDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date(i.t + (i.dateOnly ? 3600000 : 0)))
               === new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date(now));
  const dayName = sameDay ? t('match.today') : new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(new Date(i.t + (i.dateOnly ? 3600000 : 0)));
  if(i.dateOnly) return {live:false, text: dayName, row: dayName};
  if(now >= i.t) return {live:true, text: `<span class="live">${t('match.live')}</span> · ${t('match.started', {t:t12})}`, row: `<span class="live">${t('match.live')}</span>`};
  return {live:false, text: `${dayName} · ${t12}`, row: `${dayName} ${t12}`};
}
function eventSlot(key, now){
  const x = eventsOf(key, now)[0];
  if(!x) return '';
  const w = eventWhen(x.i, now);
  const about = [x.i.pre, x.i.tag, x.i.country].filter(Boolean).map(esc).join(' · ');
  return `<div class="mblock"><div class="big"><span>${x.i.head}</span></div>`
       + (about ? `<div class="sub">${about}</div><div class="sub when">${w.text}</div>` : `<div class="sub">${w.text}</div>`) + `</div>`;
}

// Every followed team with something to show, two at a time; the page turns every 15 s.
let MATCH_PAGE = 0, MATCH_PAGES = 1;
// Two games a page. Two games whose names do not fit side by side even at the smallest size and the short names
// (a league has such pairs: «كهرباء الإسماعيلية × الاتحاد السكندري») are learnt here and shown one to a page from then on.
const NARROW = new Set();
const pairKey = (a, b) => [a, b].map(h => (h.match(/class="tm"[^>]*>[^<]*/g) || [h]).join('|')).join('||');
function packPages(slots, per){
  const pages = [];
  for(let i = 0; i < slots.length;){
    const two = per > 1 && i + 1 < slots.length && !NARROW.has(pairKey(slots[i], slots[i + 1]));
    pages.push(slots.slice(i, i + (two ? per : 1)));
    i += two ? per : 1;
  }
  return pages;
}
function renderMatches(turn){
  if(!SLOT_MATCHES) return;
  const now = Date.now(), shown = new Set();
  let games = CONFIG.teamIds.map(id => matchSlot(id, now, shown)).filter(Boolean);
  if(CONFIG.leagues.length) games = [...games, ...leagueShow(now, shown)].sort((a, b) => a.t - b.t);   // one time order
  const live = focusGames(now, true);   // a followed team is playing: that game alone, big, until it ends
  const slots = live.length ? live.map(ev => gameBlock(ev, now, true))
    : [...games.map(g => g.html), ...CONFIG.events.map(k => eventSlot(k, now))].filter(Boolean);
  const row = document.getElementById('match-row');
  if(!slots.length){ if(!MATCHES_LOADED && row.firstElementChild) return; setHTML(row, '<div class="none-week">' + esc(t('match.noneWeek')) + '</div>'); return; }
  const per = live.length ? 1 : CONFIG.matchesPerPage;
  let pages = packPages(slots, per);
  if(turn) MATCH_PAGE++;
  MATCH_PAGE %= pages.length;
  const draw = () => {
    const page = pages[MATCH_PAGE];
    if(!setHTML(row, page.join(''), turn && pages.length > 1)) return true;   // fitted again only when rewritten
    if(fitMatches(row) || page.length < 2) return true;
    NARROW.add(pairKey(page[0], page[1]));
    return false;
  };
  if(!draw()){ pages = packPages(slots, per); draw(); }
  MATCH_PAGES = pages.length;
  if(turn && pages.length > 1){ row.classList.remove('flip'); void row.offsetWidth; row.classList.add('flip'); }
}

// form (only then); still too long, renderMatches shows the two games one to a page; the ellipsis stays a last

const TEAM_SHORT = {
  'مانشستر سيتي':'السيتي', 'مانشستر يونايتد':'اليونايتد', 'ريال مدريد':'الريال', 'أتلتيكو مدريد':'أتلتيكو',

  'باير ليفركوزن':'ليفركوزن', 'آينتراخت فرانكفورت':'فرانكفورت', 'نوتنغهام فورست':'فورست', 'كريستال بالاس':'بالاس',
  'وولفرهامبتون':'وولفز', 'سبورتينغ لشبونة':'سبورتينغ', 'لوس أنجلوس جالاكسي':'جالاكسي', 'البنك الأهلي المصري':'البنك الأهلي',
  ...__TEAMS_SHORT__,   // NBA and NFL: the nickname without the city («ليكرز»), made by src/build.py from teams.json

const TEAM_SHORT_EN = {
  'Manchester City':'Man City', 'Manchester United':'Man United', 'Atlético Madrid':'Atlético',
  'Paris Saint-Germain':'PSG', 'Bayern Munich':'Bayern', 'Borussia Dortmund':'Dortmund',
  'Borussia Mönchengladbach':'Gladbach', 'Bayer Leverkusen':'Leverkusen', 'Eintracht Frankfurt':'Frankfurt',

  'Wolverhampton':'Wolves', 'Sporting CP':'Sporting', 'LA Galaxy':'Galaxy', 'Al Ahly':'Al Ahly',
  ...__TEAMS_SHORT_EN__,
};
const FIT_STEPS = [1, .92, .85, .78, .72];
const FIT_RANGE = document.createRange();
function fits(sp){   // to the fraction of a pixel: scrollWidth rounds, and a name short by 0.4 px still got «…»
  FIT_RANGE.selectNodeContents(sp);
  const cs = getComputedStyle(sp);
  return FIT_RANGE.getBoundingClientRect().width <= sp.getBoundingClientRect().width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + .05;
}
const shorten = sp => sp.querySelectorAll('.tm').forEach(el => {
  const s = el.dataset.short || (RTL ? TEAM_SHORT : TEAM_SHORT_EN)[el.textContent.trim()];
  if(s) el.textContent = s;
});
function fitMatches(row){
  const spans = [...row.querySelectorAll('.mblock .big > span')];
  const size = k => spans.forEach(sp => { sp.style.fontSize = k === 1 ? '' : k + 'em'; });
  const step = () => FIT_STEPS.find(k => { size(k); return spans.every(fits); });
  if(step()) return true;
  spans.forEach(shorten);
  if(step()) return true;
  size(FIT_STEPS[FIT_STEPS.length - 1]);
  return false;   // the caller may show these games apart
}
// the card beside the clock has room for a whole game; only a row that would end in «…» takes the short names
// with crests (the launcher's card) the next step is the short names, then no crests: the names alone, as before
// still too long (a narrow card: beside a wide clock, or in the TV's own font when ours didn't load): a little smaller, never «…»
function shortenRows(ul){
  ul.querySelectorAll('li > span:first-child').forEach(sp => {
    if(fits(sp)) return;
    shorten(sp);
    if(!fits(sp)) sp.querySelectorAll('img.cr').forEach(i => i.remove());
    if(!fits(sp)) FIT_STEPS.slice(1).find(k => { sp.style.fontSize = k + 'em'; return fits(sp); });
  });
}

function num(v, dec){
