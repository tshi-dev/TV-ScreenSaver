// ---- the bottom-left slot: matches, weather, fasting, a countdown, or nothing (#slot=) ----
// Matches are the default; with no team or other sport followed the slot shows the weather instead of an empty line.
const SLOT_MATCHES = CONFIG.slot === 'matches' && (CONFIG.teamIds.length > 0 || CONFIG.leagues.length > 0 || CONFIG.events.length > 0);   // teams, leagues or other sports
const NEEDS_MATCHES = SLOT_MATCHES || USES('matches');   // the slot or a card
const FAST_TODAY_UNTIL = 18;   // from this hour (Riyadh) today's fast is behind us: look from tomorrow on

// What is recommended on a Hijri day (month hm, day hd, weekday wd, 0 = Sunday), best reason first.
// Always [] on the days fasting is forbidden: the two Eids and the three days of Tashreeq.
function fastReasons(hm, hd, wd){
  if((hm === 10 && hd === 1) || (hm === 12 && hd >= 10 && hd <= 13)) return [];
  const out = [];
  if(hm === 9) return ['ramadan'];
  if(hm === 12 && hd === 9) out.push('arafah');
  if(hm === 1 && hd === 9) out.push('tasua');
  if(hm === 1 && hd === 10) out.push('ashura');
  if(hd >= 13 && hd <= 15) out.push('white');
  if(wd === 1) out.push('mon');
  if(wd === 4) out.push('thu');
  if(hm === 10 && hd >= 2) out.push('shawwal');
  return out;
}
const FAST_HIJRI = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {timeZone:'UTC', month:'numeric', day:'numeric'});
// The next day to fast from `now`: {key, days (0 = today), day (Hijri), wd, date (UTC noon)}, or null.
function fastingNext(now){
  const p = riyadhParts(now), base = Date.UTC(p.y, p.mo - 1, p.d, 12);
  for(let i = 0; i < 12; i++){
    const date = new Date(base + i*86400000);
    const h = FAST_HIJRI.formatToParts(date).reduce((a, x) => (a[x.type] = +x.value.replace(/[^0-9]/g, ''), a), {});
    const why = fastReasons(h.month, h.day, date.getUTCDay());
    if(!why.length || (i === 0 && p.h >= FAST_TODAY_UNTIL && why[0] !== 'ramadan')) continue;
    return {key:why[0], days:i, day:h.day, wd:date.getUTCDay(), date};
  }
  return null;
}

// days from today (Riyadh) to the countdown's date, or null: none set, or it has passed
function countdownDays(){
  if(!CONFIG.cd) return null;
  const p = riyadhParts(), n = (Date.parse(CONFIG.cd + 'T00:00:00Z') - Date.UTC(p.y, p.mo - 1, p.d)) / 86400000;
  return n >= 0 ? n : null;
}
// what the slot shows now: matches with no team, and a countdown that has passed, show the weather
function slotNow(){
  if(CONFIG.slot === 'none') return 'none';
  if(CONFIG.slot === 'countdown' && countdownDays() !== null) return 'countdown';
  if(CONFIG.slot === 'markets') return 'markets';
  return CONFIG.slot === 'fasting' ? 'fasting' : SLOT_MATCHES ? 'matches' : 'weather';
}
const slotBlock = (big, sub, when) => `<div class="mblock"><div class="big"><span>${big}</span></div>`
  + (sub ? `<div class="sub${when ? ' when' : ''}">${sub}</div>` : '') + '</div>';
const dayName = d => new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(d);

// the HTML for a slot; null = nothing to say, keep what was shown last
function slotHTML(s){
  if(s === 'weather'){
    const today = new Intl.DateTimeFormat('en-CA', {timeZone:CONFIG.timezone}).format(new Date());
    const days = FORECAST.filter(d => d.date > today).slice(0, 3);   // the next three days (a saved forecast may be old)
    if(!days.length) return null;
    return days.map(d => slotBlock(dayName(new Date(d.date + 'T12:00:00Z')) + ' <span class="num">' + ar(Math.round(d.hi)) + '°</span>',
      esc(WX_CODES[d.code] || ''), true)).join('');
  }
  if(s === 'fasting'){
    const f = fastingNext(new Date());
    if(!f) return null;
    const when = f.key === 'ramadan' && f.days === 0 ? t('fast.ramadanDay', {n: ar(f.day)})
      : f.days === 0 ? t('fast.today')
      : f.days === 1 ? t('fast.tomorrowOn', {day: dayName(f.date)})
      : f.days === 2 ? t('fast.in2')
      : f.days <= 10 ? t('fast.inDays', {n: ar(f.days)}) : t('fast.manyDays', {n: ar(f.days)});
    return slotBlock(t('fast.' + f.key), when);
  }
  if(s === 'markets'){   // the chosen markets with price and change, whatever the top-left shows; nothing known yet = keep
    const known = TICKERS.filter(t => MK_LAST[t.key]).slice(0, 3);
    if(!known.length) return null;
    return known.map(t => { const v = MK_LAST[t.key];
      return slotBlock(esc(t.name) + (v.price ? ' <span class="num">' + num(v.price, t.dec) + '</span>' : ''),
        v.pct === null ? '' : `<span class="${v.pct >= 0 ? 'up' : 'down'}">${v.pct >= 0 ? '▲' : '▼'} ${num(Math.abs(v.pct), 2)}${PCT}</span>`); }).join('');
  }
  if(s === 'countdown'){
    const n = countdownDays();
    const name = CONFIG.cdName ? esc(CONFIG.cdName)
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', day:'numeric', month:'long'}).format(new Date(CONFIG.cd + 'T12:00:00Z'));
    const count = n === 0 ? t('slot.countdown.today')
      : t(n === 1 ? 'slot.countdown.day' : 'slot.countdown.days', {n: '<span class="num">' + ar(n) + '</span>'});
    return slotBlock(count, name);
  }
  return null;
}

function paintDir(t, up, label){

  chEl.hidden = false; chEl.style.display='';

// price (in the market's own unit, or null) and the day's change in percent (or null); only what is known is shown
const MK_LAST = {};   // the last known price and change per market, for the bottom-left slot
function paintMarket(mk, price, pct){
  const okP = typeof price === 'number' && isFinite(price) && price > 0;
  const okC = typeof pct === 'number' && isFinite(pct);
  if(okP || okC){ MK_LAST[mk.key] = {price: okP ? price : null, pct: okC ? pct : null}; if(CONFIG.slot === 'markets') renderSlot(); }
  if(!PRICES){ paintDir(mk, okC ? pct >= 0 : null); return; }
  const px = document.getElementById(mk.px);
  if(okP){ px.hidden = false; setText(px, num(price, mk.dec)); } else { px.hidden = true; setText(px, ''); }
  paintDir(mk, okC ? pct >= 0 : null, okC ? num(Math.abs(pct), 2) + PCT : '');
  const up = document.getElementById('mk-up');
  if(up && (okP || okC)){ const p = riyadhParts(); up.hidden = false; setText(up, t('market.updated', {time: fmt12(p.h, p.mi)})); }
}

// Yahoo has no CORS headers: try it directly (works inside the app), then through public CORS gateways
async function yahooChart(sym, q = 'interval=1d&range=5d'){
  const direct = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?${q}`;
  const routes = [
    [direct, 7000, j => j],
    ['https://api.allorigins.win/get?url=' + encodeURIComponent(direct), 15000, w => JSON.parse(w.contents)],
    ['https://corsproxy.io/?url=' + encodeURIComponent(direct), 12000, j => j],
  ];
  for(const [url, ms, unwrap] of routes){
    try{
      const r = await fetchT(url, ms);
      if(!r.ok) continue;
      const j = unwrap(await r.json());
      if(j && j.chart && j.chart.result) return j;
    }catch(e){}
  }
  throw 0;
}

async function loadTicker(t){
  try{
    if(t.cg){                                  // crypto: CoinGecko, CORS friendly
      const r = await fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${t.cg}&vs_currencies=usd&include_24hr_change=true`, 10000);
      if(!r.ok) throw 0;
      const j = await r.json();
      const c = j && j[t.cg] ? j[t.cg] : null;
      const d = c ? (c.usd_24h_change ?? c.usd_24hr_change ?? null) : null;
      paintMarket(t, c ? c.usd : null, d);
      return;
    }
    const j = await yahooChart(t.sym);
    const res = j.chart.result[0];
    const price = res.meta.regularMarketPrice;
    const closes = (res.indicators.quote[0].close || []).filter(x=>x != null);
    const prev = closes.length >= 2 ? closes[closes.length-2]
               : (res.meta.chartPreviousClose || res.meta.previousClose || null);
    paintMarket(t, typeof price === 'number' ? price * (t.mul || 1) : null,
                typeof price === 'number' && prev ? (price - prev) / prev * 100 : null);
  }catch(e){ if(!document.getElementById(t.chg).textContent) paintDir(t, null); }   // offline: keep what is on screen
}

const SKIP_TYPES = ['News','Talk Show','Sports','Game Show'];
let NET_OK = 0;   // answers received; a refresh that got none must not replace what is on screen
async function getJSON(url, fallback){
  try{ const r = await fetchT(url, 12000); if(!r.ok) return fallback; const j = await r.json(); NET_OK++; return j; }
  catch(e){ return fallback; }
}
async function loadWeek(){
  const F = CONFIG.shows, seen = new Set(), out = [], answered = NET_OK;
  const days = [];
  for(let i=0;i<7;i++) days.push(new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date(Date.now()+i*86400000)));
  const inWeek = d => d && d >= days[0] && d <= days[6];
  const add = (s, e, picked) => {
    if(!s || !s.name || seen.has(s.name)) return;
    seen.add(s.name);
    const prem = e.number === 1;
    out.push({
      name: s.name,
      ep: e.season ? (prem ? t('show.season', {n: ar(e.season)}) : t('show.seasonEp', {n: ar(e.season), e: ar(e.number)})) : '',
      date: e.airdate || '',
      rating: (s.rating && s.rating.average) || 0,
      prem, picked
    });
  };

  // shows picked one by one: their next episode, if it airs this week
  const picked = await Promise.all(F.ids.map(id => getJSON(`https://api.tvmaze.com/shows/${id}?embed=nextepisode`, null)));
  picked.forEach(s => {
    const e = s && s._embedded && s._embedded.nextepisode;
    if(e && inWeek(e.airdate)) add(s, e, true);
  });

  // the schedule, narrowed by genre and language; skipped when only picked shows were chosen
  if(!F.ids.length || F.genres.length || F.langs.length){
    const lists = await Promise.all(days.flatMap(dt => [
      getJSON(`https://api.tvmaze.com/schedule/web?date=${dt}`, []),
      ...F.countries.map(c => getJSON(`https://api.tvmaze.com/schedule?country=${encodeURIComponent(c)}&date=${dt}`, []))
    ]));
    lists.flat().forEach(e => {
      const s = e.show || (e._embedded && e._embedded.show) || {};
      if(s.type && SKIP_TYPES.includes(s.type)) return;
      if(s.genres && s.genres.includes('Soap')) return;   // no daytime soaps
      if(!e.number || e.number < 1) return;
      if(e.season && e.season > 15) return;               // keep it to real series
      if(((s.rating && s.rating.average) || 0) < F.minRating) return;
      if(F.genres.length && !(s.genres || []).some(g => F.genres.includes(g))) return;
      if(F.langs.length && !F.langs.includes(s.language)) return;
      add(s, e, false);
    });
  }

  // nothing answered (offline): keep the saved list if one is shown
  if(NET_OK === answered && CARDS.some(c => c.kind === 'shows' && c.ul.querySelector('li:not(.empty)'))) return;
  if(out.length){                                   // keep the last good list on a failed refresh
    WEEK_POOL = out.sort((a,b)=> (b.picked - a.picked) || (b.prem - a.prem) || a.date.localeCompare(b.date)).slice(0, 50);
    CARDS.forEach(c => { if(c.kind === 'shows') c.page = 0; });
  }
  WEEK_LOADED = true;
  renderPanel(false, 'shows');
}

const WEEK_ROWS = 5;
const MATCH_ROWS = 4;   // the games card: each game takes two lines (teams, date and time)
let WEEK_POOL = [], WEEK_LOADED = false;

// «جديد المسلسلات»: this card's page of the pool (card.page counts pages of card.cap, or WEEK_ROWS, rows)
function renderWeekPage(card, animate){
  const ul = card.ul;
  if(!WEEK_POOL.length){
    if(!WEEK_LOADED) return;   // the saved list stays until the first answer
    ul.classList.remove('flip');
    setHTML(ul, '<li class="empty">' + esc(t('show.none')) + '</li>');
    return;
  }
  const per = card.cap || WEEK_ROWS, start = (card.page * per) % WEEK_POOL.length;
  const rows = [];
  for(let i = 0; i < Math.min(per, WEEK_POOL.length); i++){
    rows.push(WEEK_POOL[(start + i) % WEEK_POOL.length]);
  }
  setHTML(ul, rows.map(o=>{
    const dt = o.date ? new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date(o.date+'T12:00:00Z')) : '';
    return `<li><span>${esc(o.name)}</span>`
         + (o.ep?`<span class="ep">${ar(o.ep)}</span>`:'')
         + (o.rating ? `<span class="rt">${ar(o.rating.toFixed(1)).replace('.', LATIN ? '.' : '٫')}</span>` : '')
         + (dt?`<span class="dt">${dt}</span>`:'') + '</li>';
  }).join(''), animate);
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

// ---- the cards: the screensaver has one beside the clock, the launcher's page up to three (CONFIG.cards, one kind each).
// Each is its own element with its own page, timers and size: renderCard(card) draws one kind into that card, nothing else is shared
// but the data the kinds load. card.z is its text size (1 = full), card.cap the rows a page of a list may hold; the launcher
// steps both down until the cards fit their box (fitCards).
const CARDS = [];
function buildCards(){
  const first = document.querySelector('.week'), mid = document.querySelector('.mid');
  if(!CONFIG.cards.length){ first.style.display = 'none'; return; }
  CONFIG.cards.forEach((kind, i) => {
    let el = first;
    if(i){
      el = first.cloneNode(true);
      el.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
      CARDS[i - 1].el.after(el);
    }
    CARDS.push({i, kind, eff: kind, el, hd: el.querySelector('.hd'), ul: el.querySelector('ul'),
      page: 0, z: 1, zi: 0, ri: 0, cap: 0, maxLen: 0, base: 0, len0: 0, ad: {i: 0, t: 0, mode: '', n: 0}, yearShown: false});
  });
  mid.classList.add('n' + CARDS.length);
  if(CARDS.length === 3) CARDS[2].el.classList.add('w3');
}

let FORECAST = [];
try{ FORECAST = JSON.parse(localStorage.getItem('forecast:' + location.hash) || '[]') || []; }catch(e){}
const PANEL_TITLE = {today:t('match.yourDay'), shows:t('week.this'), prayers:t('match.todaysPrayers'), forecast:t('match.nextDays'), hourly:t('match.nextHours'), matches:CONFIG.leagues.length ? t('match.matches') : t('match.yourTeams'), tasks:t('match.tasks'), year:t('match.year')};
const LISTS = ['matches', 'stocks', 'tasks', 'shows'];   // the kinds that page through their rows

// ---- «يومك» (today): the day in one card: the next prayer, the next game of a followed team, the first open task, the next
// occasion. A line with nothing to say is left out.
function nextFollowedGame(now){
  const seen = new Set(), all = [];
  CONFIG.teamIds.forEach(id => [MATCHES[id], ...(NEXT_LIST[id] || [])].forEach(ev => {
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    seen.add(ev.idEvent);
    const k = toDate(ev).getTime(), st = (ev.strStatus || '').toUpperCase();
    if(isNaN(k) || FINAL.includes(st) || CALLED_OFF.test(st) || now >= k + durMs(ev) || k - now > CONFIG.weekWindowDays * 86400000) return;
    all.push({ev, k});
  }));
  all.sort((a, b) => a.k - b.k);
  return all.length ? all[0] : null;
}
const tdRow = (k, v, r) => `<li class="td"><span class="k">${k}</span><span class="v">${v}</span>${r ? `<span class="r">${r}</span>` : ''}</li>`;
function todayCard(){
  const rows = [], now = Date.now();
  if(PRAYERS.length){
    const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
    let n = PRAYERS.find(x => x.h * 60 + x.mi > mins), tomorrow = false;
    if(!n){ n = PRAYERS[0]; tomorrow = true; }
    rows.push(tdRow(t('match.nextPrayer'), `${prayerName(n)} · ${fmt12(n.h, n.mi)}`, t('prayer.after') + ' ' + shortHM(Math.max(0, Math.round((n.h * 60 + n.mi + (tomorrow ? 1440 : 0) - mins) * 60)))));
  }
  const g = nextFollowedGame(now);
  if(g){
    const live = now >= g.k;
    rows.push(tdRow(t('match.match'), `<span class="tm">${esc(teamAr(g.ev.strHomeTeam, g.ev.idHomeTeam))}</span>${t('match.vs')}<span class="tm">${esc(teamAr(g.ev.strAwayTeam, g.ev.idAwayTeam))}</span>`,
      live ? '<span class="live">' + t('match.live') + '</span>' : t('prayer.after') + ' ' + shortRemaining(g.k - now).split(t('join'))[0]));
  }
  if(CONFIG.tasks.length) rows.push(tdRow(t('match.task'), esc(CONFIG.tasks[0])));
  const oc = occasionNow();
  if(oc){
    const name = t('occ.' + oc.o.key + '.name') + (oc.o.year ? ' ' + ar(oc.hy) : '');
    rows.push(tdRow(oc.today ? t('match.today') : t('match.nextOccasion'), esc(name), oc.today ? '' : t('prayer.after') + ' ' + qty(oc.days, 'day')));
  }
  return {title: t('match.yourDay'), rows};
}

// ---- a followed team's game under way, big: its score, the minute and «مباشر» (item 2). The matches card and the bottom slot
// show it alone, with both crests where there are crests (the launcher's card), until it ends; then they go back to the list.
function liveWhen(ev){   // «مباشر» and «الدقيقة ٦٧» / «استراحة» / «بدأت ٦:٣٠ م»
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(toDate(ev)).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return `<span class="live">${t('match.live')}</span> · ${liveStatus(ev, ar(fmt12(+p.hour % 24, +p.minute)))}`;
}
const liveScore = ev => ev.intHomeScore != null && ev.intAwayScore != null ? `<span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span>` : `<span class="sc">${t('match.vs').trim()}</span>`;
function liveRow(ev){   // a row of the card
  return `<li class="lv"><div class="lvm">${liveWhen(ev)}</div><div class="lvt"><span class="tm">${crestImg(ev, 'Home')}${esc(teamAr(ev.strHomeTeam, ev.idHomeTeam))}</span>`
    + `${liveScore(ev)}<span class="tm">${crestImg(ev, 'Away')}${esc(teamAr(ev.strAwayTeam, ev.idAwayTeam))}</span></div></li>`;
}
// one line, always: the names step down in size, then take their short forms, then lose their crests (as the list's rows do)
function fitLive(ul){
  ul.querySelectorAll('.lvt').forEach(t => {
    const ok = () => t.scrollWidth <= t.clientWidth + .5;
    const step = (steps = FIT_STEPS) => steps.find(k => { t.style.setProperty('--k', k); return ok(); });
    if(step()) return;
    shorten(t);
    if(step()) return;
    t.querySelectorAll('img.cr').forEach(i => i.remove());
    step([...FIT_STEPS, .64, .56, .5]);   // a narrow card: smaller still, never two lines
  });
}

// ---- «البطاقة الذكية» (smart): the card for what matters now, picked again with every redraw (the clock timers draw it every 15 s,
// so a change shows within a minute); no request of its own, it shows what the other cards load. In this order:
//  1. a followed team's game is live, or starts within 60 minutes: the matches card, with that game;
//  2. within 15 minutes of a prayer: the prayers' row, with the minutes left in its title (before the adhkar: the last quarter
//     hour of the adhkar window is the wait for Dhuhr or Maghrib, and the prayer is what matters then);
//  3. the adhkar window (morning from Fajr to Dhuhr, evening from Asr to Maghrib): the adhkar card;
//  4. otherwise: the next hours' weather.
const SMART_GAME_MIN = 60, SMART_PRAYER_MIN = 15;
// the followed teams' games that are live now, or (not liveOnly) start within SMART_GAME_MIN minutes: [ev] in time order
function focusGames(now, liveOnly){
  const seen = new Set(), out = [];
  CONFIG.teamIds.forEach(id => [MATCHES[id], ...(NEXT_LIST[id] || [])].forEach(ev => {
    if(!ev || !ev.idEvent || seen.has(ev.idEvent)) return;
    seen.add(ev.idEvent);
    const k = toDate(ev).getTime(), st = (ev.strStatus || '').toUpperCase();
    if(isNaN(k) || FINAL.includes(st) || CALLED_OFF.test(st)) return;
    const live = now >= k && now < k + durMs(ev), soon = now < k && k - now <= SMART_GAME_MIN * 60000;
    if(live || (soon && !liveOnly)) out.push(ev);
  }));
  return out.sort((a, b) => toDate(a) - toDate(b));
}
function prayerSoon(minutes){   // is a prayer's adhan within that many minutes?
  const p = riyadhParts(), now = p.h * 60 + p.mi + p.s / 60;
  return PRAYERS.some(x => { const d = x.h * 60 + x.mi - now; return d > 0 && d <= minutes; });
}
function smartKind(now = Date.now()){
  if(CONFIG.teamIds.length && focusGames(now).length) return 'matches';
  if(prayerSoon(SMART_PRAYER_MIN)) return 'prayerrow';
  const w = adhkarWindow();
  if(w === 'morning' || w === 'evening') return 'adhkar';
  return 'hourly';
}


// the header: HTML when the kind has icons or a note in it, else its title (the two never share a stale copy)
function paintHd(hd, title, html){
  if(html) setHTML(hd, html); else { setText(hd, title); hd.__h = null; }
}

// Draw the cards of these kinds (none given = all). A kind may sit in a smart or «يومك» card, which follow the same data.
function renderPanel(animate, ...kinds){
  for(const c of CARDS){
    if(kinds.length && !kinds.includes(c.kind) && c.kind !== 'smart' && c.kind !== 'today') continue;
    renderCard(c, animate);
  }
  fitCards();
}

function renderCard(card, animate, keepSize){
  const ul = card.ul, hd = card.hd;
  const was = card.eff;
  card.eff = card.kind === 'smart' ? smartKind() : card.kind;
  const P = card.eff;
  if(P !== was){   // the smart card changed its mind: a fresh page of the new kind
    card.page = 0; card.skip = 0; card.maxLen = 0; ul.__h = null;
    if(was === 'adhkar'){ clearTimeout(card.ad.t); card.ad.t = 0; card.ad.mode = ''; }
  }
  if(!keepSize){ card.z = 1; card.cap = 0; card.maxLen = 0; card.zi = 0; card.ri = 0; card.el.style.removeProperty('--z'); }
  if(P === 'shows'){ paintHd(hd, PANEL_TITLE.shows); renderWeekPage(card, animate); return; }
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'hourly') rows = hourlyRows();
  else if(P === 'prayerrow'){ const q = prayerRowCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'matches') rows = matchRows(card);
  else if(P === 'year') rows = [yearCard(card)];
  else if(P === 'today'){ const q = todayCard(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'tasks') rows = CONFIG.tasks.map(t => `<li class="task"><span>${esc(t)}</span></li>`);
  else if(P === 'verse'){ const q = quoteOfDay(card); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'wisdom'){ const q = wisdomOfDay(); paintHd(hd, q.title); rows = q.rows; }
  else if(P === 'adhkar'){ const q = adhkarCard(card); paintHd(hd, q.title, q.hd); rows = q.rows; }
  else if(P === 'stocks'){ const q = stocksCard(); paintHd(hd, '', q.hd); rows = q.rows; }
  if(PANEL_TITLE[P]) paintHd(hd, PANEL_TITLE[P]);
  if(!rows.length){
    if(P === 'matches' && !MATCHES_LOADED && ul.firstElementChild && !ul.firstElementChild.classList.contains('empty')) return;   // the saved games stay until the first answer
    ul.classList.remove('flip');
    setHTML(ul, `<li class="empty">${esc(P === 'matches' ? t('match.none') : P === 'tasks' ? t('match.noTasks') : t('match.noData'))}</li>`);
    return;
  }
  const per = card.cap || (P === 'matches' ? MATCH_ROWS : WEEK_ROWS);
  if((P === 'matches' || P === 'stocks' || P === 'tasks') && rows.length > per){        // page through, like the shows
    const start = (card.page * per) % rows.length;
    rows = Array.from({length: per}, (_, i) => rows[(start + i) % rows.length]);
  }
  const wrote = setHTML(ul, rows.join(''), animate);
  if(!keepSize){ card.base = rows.length; card.len0 = card.len || 0; }   // what full size holds: the rows of a page, the length of the text
  if(P === 'matches'){ fillCrests(ul); if(wrote){ shortenRows(ul); fitLive(ul); } }
  if(CONFIG.tafsir) fitTafsir(ul);
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
}

// ---- sizing in the launcher. The cards share the box of the WebView (two or three of them). A card that does not fit steps
// down in text size, then in rows per page (a list), then picks a shorter text (a verse, a hadith, a dhikr); the one that is
// cut off or tallest goes first. One card keeps the box to itself and is never changed, as it always was.
// How a card gets smaller, one step at a time. Its text size comes from Z_STEPS (card.zi); a list may also give rows (card.ri
// of them gone: the pages are shorter, and every row still comes round), a verse or a dhikr ask for a shorter text (card.ri
// times a fifth shorter than the day's). A card that is too tall gives rows first, a quote comes down to .82 before a shorter
// text is looked for; one that is too wide (a name that would end in «…») can only give text size.
const Z_STEPS = [1, .94, .88, .82, .76, .7, .64];
function cardCut(card){   // a name or a cell wider than its place: it would end in «…» or run into the next
  for(const e of card.el.querySelectorAll('li, li *, .hd > span')){
    if(e.clientWidth > 0 && e.scrollWidth > e.clientWidth + 1) return true;
  }
  return false;
}
function shrinkCard(c, tooWide){   // false when there is no step left
  const list = LISTS.includes(c.eff), quote = c.eff === 'verse' || c.eff === 'adhkar', zLeft = c.zi < Z_STEPS.length - 1;
  if(tooWide){ if(!zLeft) return false; c.zi++; }
  else if(list && c.ri < c.base - 1) c.ri++;
  else if(quote && c.zi < 3) c.zi++;
  else if(quote && c.ri < 6) c.ri++;
  else if(zLeft) c.zi++;
  else return false;
  const cap = list && c.ri ? c.base - c.ri : 0, maxLen = quote && c.ri ? Math.max(20, Math.floor(c.len0 * Math.pow(.8, c.ri))) : 0;
  c.z = Z_STEPS[c.zi];
  c.el.style.setProperty('--z', c.z);
  if(cap !== c.cap || maxLen !== c.maxLen){ c.cap = cap; c.maxLen = maxLen; renderCard(c, false, true); }
  return true;
}
function fitCards(){
  if(!CONFIG.widget || CARDS.length < 2) return;
  const mid = document.querySelector('.mid');
  for(let g = 0; g < 120; g++){
    const tall = mid.getBoundingClientRect().height > innerHeight + .5;
    const cut = CARDS.filter(cardCut);
    if(!tall && !cut.length) return;
    // the cut-off cards first; then, only if the box is too tall, the tallest that can still give something
    if(cut.some(c => shrinkCard(c, true))) continue;
    if(!tall || !CARDS.slice().sort((a, b) => b.el.offsetHeight - a.el.offsetHeight).some(c => shrinkCard(c))) return;
  }
}

// ---- «السنة»: a dot for every day of this Gregorian year (Riyadh time). Drawn again only when the day changes.
function yearCard(card){
  const p = riyadhParts(new Date(Date.now())), y = p.y;
  const total = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
  const day = Math.round((Date.UTC(y, p.mo - 1, p.d) - Date.UTC(y, 0, 1)) / 864e5) + 1;
  const COLS = 36, ROWS = Math.ceil(total / COLS), PITCH = 10, R = 3.2;
  const rows = [];
  for(let r = 0; r < ROWS; r++){
    let g = '';
    for(let c = 0; c < COLS; c++){
      const n = r * COLS + c + 1;
      if(n > total) break;
      const cx = (RTL ? COLS - 1 - c : c) * PITCH + PITCH / 2, cy = r * PITCH + PITCH / 2;   // with the page's direction
      if(n < day) g += `<circle class="on" cx="${cx}" cy="${cy}" r="${R}" fill-opacity="${(.28 + .72 * n / day).toFixed(2)}"/>`;
      else if(n === day) g += `<circle class="halo" cx="${cx}" cy="${cy}" r="${R * 3}" fill-opacity=".12"/><circle class="halo" cx="${cx}" cy="${cy}" r="${R * 1.9}" fill-opacity=".28"/><circle class="now" cx="${cx}" cy="${cy}" r="${R * 1.15}"/>`;
      else g += `<circle class="off" cx="${cx}" cy="${cy}" r="${R}"/>`;
    }
    rows.push(`<g class="r" style="--i:${r}">${g}</g>`);
  }
  const pct = Math.round(100 * day / total), anim = !card.yearShown;
  card.yearShown = true;
  const svg = `<svg viewBox="-10 -10 ${COLS * PITCH + 20} ${ROWS * PITCH + 20}" role="img" aria-label="${ar(day)} / ${ar(total)}">${rows.join('')}</svg>`;
  return `<li class="yr${anim ? ' fill' : ''}"><div class="yn">${ar(y)}</div>${svg}`
       + `<div class="yt">${t('match.dayOf', {day:'<b>' + ar(day) + '</b>', total:ar(total), pct:ar(pct) + PCT})}</div></li>`;
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const names = {Fajr:t('prayer.Fajr'), Sunrise:t('prayer.Sunrise'), Dhuhr:isFriday() ? t('prayer.Jumuah') : t('prayer.Dhuhr'), Asr:t('prayer.Asr'), Maghrib:t('prayer.Maghrib'), Isha:t('prayer.Isha')};
  let next = null;
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;
    let cls = at < now ? 'past' : '';
    if(at >= now && !next){ next = k; cls = 'next'; }
    return `<li class="${cls}"><span>${names[k]}</span><span class="dt">${fmt12(h, mi)}</span></li>`;
  });
}

function forecastRows(){
  return FORECAST.slice(0, 5).map((d, i) => {
    const day = i === 0 ? t('match.today') : i === 1 ? t('match.tomorrow')
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    return `<li><span>${day}</span><span class="ep">${WX_CODES[d.code] || ''}</span>`
         + `<span class="dt">${ar(Math.round(d.hi))}° / ${ar(Math.round(d.lo))}°</span></li>`;
  });
}

// ---- club crests on the launcher's matches card: TheSportsDB's badge, which the events already carry
// (strHomeTeamBadge / strAwayTeamBadge, with idHomeTeam / idAwayTeam). No request of its own except the picture,
// once per club: kept as a 48 px copy in localStorage and fetched again only when the badge's address changes.
const CRESTS_ON = CONFIG.widget && USES('matches');
const CREST_PX = 48, CREST_KEEP = 60, CREST_PER_ROUND = 10, CREST_RETRY_MS = 6 * 3600000;
let CRESTS = {};   // team id -> {u: badge address, d: data: URI of the small copy}
try{ CRESTS = JSON.parse(localStorage.getItem('crests') || '{}') || {}; }catch(e){}
const CREST_TRIED = {};   // team id -> when a fetch last failed
function crestOf(ev, side){
  const u = String(ev['str' + side + 'TeamBadge'] || ''), id = String(ev['id' + side + 'Team'] || '');
  return /^https:\/\/[a-z0-9.-]+\.thesportsdb\.com\/\S+$/i.test(u) && /^\d+$/.test(id) ? {id, u} : null;
}
const crestImg = (ev, side) => {
  const c = CRESTS_ON && crestOf(ev, side);
  return c && CRESTS[c.id] && CRESTS[c.id].d ? `<img class="cr" data-t="${c.id}" alt="">` : '';   // no crest: the name alone
};
function fillCrests(root){   // the rows carry the club's id only; the picture is put in here (a saved row has none)
  root.querySelectorAll('img.cr').forEach(i => { const c = CRESTS[i.dataset.t]; if(c && c.d && i.getAttribute('src') !== c.d) i.src = c.d; });
}
function crestShrink(blob){   // -> a data: URI no larger than CREST_PX, '' when it is not a picture
  return new Promise(done => {
    const url = URL.createObjectURL(blob), im = new Image();
    const end = v => { URL.revokeObjectURL(url); done(v); };
    im.onload = () => {
      try{
        const k = Math.min(1, CREST_PX / Math.max(im.naturalWidth, im.naturalHeight, 1)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        end(c.toDataURL('image/png'));
      }catch(e){ end(''); }
    };
    im.onerror = () => end('');
    im.src = url;
  });
}
async function crestFetch(u){   // the small size the API offers first; the plain file if it refuses the suffix
  for(const url of /\/(tiny|small|medium|preview)$/.test(u) ? [u] : [u + '/tiny', u]){
    try{
      const r = await fetchT(url, 10000);
      if(!r.ok) continue;
      const d = await crestShrink(await r.blob());
      if(d) return d;
    }catch(e){}
  }
  return '';
}
let CREST_BUSY = false;
async function loadCrests(){
  if(!CRESTS_ON || CREST_BUSY) return;
  CREST_BUSY = true;
  try{
    const want = {}, now = Date.now();
    for(const ev of matchEvents()) for(const side of ['Home', 'Away']){
      const c = crestOf(ev, side);
      if(c && !(CRESTS[c.id] && CRESTS[c.id].u === c.u) && now - (CREST_TRIED[c.id] || 0) > CREST_RETRY_MS) want[c.id] = c.u;
    }
    let got = 0;
    for(const [id, u] of Object.entries(want).slice(0, CREST_PER_ROUND)){
      const d = await crestFetch(u);
      if(!d){ CREST_TRIED[id] = now; continue; }
      delete CRESTS[id]; CRESTS[id] = {u, d}; got++;
    }
    if(!got) return;
    Object.keys(CRESTS).slice(0, Math.max(0, Object.keys(CRESTS).length - CREST_KEEP)).forEach(k => delete CRESTS[k]);
    try{ localStorage.setItem('crests', JSON.stringify(CRESTS)); }catch(e){}
    renderPanel(false, 'matches');
  }finally{ CREST_BUSY = false; }
}

// ---- «الصلوات في صف»: the five prayers in one row, the next lit, and above it «المغرب بعد ١ س و ٥ د»
function shortHM(sec){   // «١ س و ٥ د», «٢ س», «٥ د»
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return [h ? ar(h) + ' ' + t('short.h') : '', m || !h ? ar(Math.max(m, 1)) + ' ' + t('short.m') : ''].filter(Boolean).join(t('join'));
}
function prayerRowCard(){
  if(!PRAYERS.length) return {title:t('match.todaysPrayers'), rows:[]};
  const p = riyadhParts(), mins = p.h * 60 + p.mi + p.s / 60;
  let next = PRAYERS.findIndex(x => x.h * 60 + x.mi > mins), tomorrow = false;
  if(next < 0){ next = 0; tomorrow = true; }   // after Isha the next is tomorrow's Fajr
  const n = PRAYERS[next], left = n.h * 60 + n.mi + (tomorrow ? 1440 : 0) - mins;
  return {
    title: t('prayer.rowIn', {name:prayerName(n), left:shortHM(Math.max(0, Math.round(left * 60)))}),
    rows: ['<li class="prow">' + PRAYERS.map((x, i) =>
      `<div class="pc${i === next ? ' next' : tomorrow || x.h * 60 + x.mi <= mins ? ' past' : ''}"><b>${prayerName(x)}</b><i>${fmt12(x.h, x.mi)}</i></div>`).join('') + '</li>'],
  };
}

function wxIcon(code, night){
  if(code <= 1) return night ? WX_SVG.moon : WX_SVG.sun;
  if(code === 2) return night ? WX_SVG.partnight : WX_SVG.part;
  if(code === 3) return WX_SVG.cloud;
  if(code === 45 || code === 48) return WX_SVG.fog;
  if(code >= 95) return WX_SVG.storm;
  if((code >= 71 && code <= 77) || code === 85 || code === 86) return WX_SVG.snow;
  return WX_SVG.rain;   // drizzle, rain and showers
}
function isNight(t){   // sunrise and sunset of that day when known, else 06:00 to 18:00
  const hm = t.slice(11, 16), sun = SUN[t.slice(0, 10)];
  return sun ? hm < sun[0] || hm >= sun[1] : hm < '06:00' || hm >= '18:00';
}
function hourlyRows(){
  const next = HOURLY.filter(x => x.t > hourKey() && x.temp != null).slice(0, 6);
  if(!next.length) return [];
  return ['<li class="hrs">' + next.map(x => {
    const h = +x.t.slice(11, 13), h12 = h % 12 === 0 ? 12 : h % 12;
    return `<div class="hc"><b>${ar(h12)} ${t(h < 12 ? 'am' : 'pm')}</b>${wxIcon(x.code, isNight(x.t))}<i>${ar(Math.round(x.temp))}°</i></div>`;
  }).join('') + '</li>'];
}

// every followed team's games this week, plus results from the last day
function matchEvents(){
  const seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  if(CONFIG.leagues.length) leagueGames().forEach(ev => {   // after the teams': a game both follow is the team's copy
    if(!seen.has(ev.idEvent) && !CALLED_OFF.test(ev.strStatus || '')){ seen.add(ev.idEvent); evs.push(ev); }
  });
  return evs;
}
// ... in time order
function matchRows(card){
  const now = Date.now();
  const live = focusGames(now, true);   // a followed team is playing: that game alone, big
  if(live.length) return live.map(ev => liveRow(ev));
  let evs = matchEvents();
  const smart = card && card.kind === 'smart';
  if(smart){ const ids = new Set(focusGames(now).map(ev => ev.idEvent)); evs = evs.filter(ev => ids.has(ev.idEvent)); }   // only the game that brought the smart card here
  const others = smart ? [] : eventRows(now);
  return [...evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => finishedRecently(x.ev, now)
      || (now < x.t + durMs(x.ev) && !FINAL.includes((x.ev.strStatus || '').toUpperCase())
          && x.t - now <= CONFIG.weekWindowDays * 86400000))
    .sort((a, b) => a.t - b.t)
    .map(({ev, t: at}) => {
      const d = new Date(at), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= at ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : t('match.vs');
      const upcoming = !finishedRecently(ev, now) && now < at;
      const when = finishedRecently(ev, now) ? t('match.ft')
        : now >= at ? '<span class="live">' + t('match.live') + '</span>'
        : t('prayer.after') + ' ' + shortRemaining(at - now).split(t('join'))[0];   // one unit: the date line says the rest
      // an upcoming game has its date and time under the teams, as in the bottom row
      const dateLine = upcoming ? `<i class="mwhen">${matchWhen(d)}</i>` : '';
      return {t: at, html: `<li><span><span class="tm">${crestImg(ev, 'Home')}${esc(teamAr(ev.strHomeTeam, ev.idHomeTeam))}</span>${mid}<span class="tm">${crestImg(ev, 'Away')}${esc(teamAr(ev.strAwayTeam, ev.idAwayTeam))}</span>${dateLine}</span><span class="dt">${when}</span></li>`};
    }), ...others].sort((a, b) => a.t - b.t).map(x => x.html);
}

// The exchanges keep their own hours whatever the city: Riyadh is UTC+3 all year. Tadawul Sun-Thu 10:00-15:00; the US Mon-Fri 16:30-23:00 (approximate; holidays are ignored)
function marketOpen(sa, ms = Date.now()){

  return sa ? day <= 4 && m >= 600 && m < 900 : day >= 1 && day <= 5 && m >= 990 && m < 1380;

async function loadStocks(){
  let got = 0;
  for(const k of CONFIG.stocks){
    try{
      const res = (await yahooChart(isSA(k) ? k + '.SR' : k, 'interval=15m&range=1d')).chart.result[0];
      const price = res.meta.regularMarketPrice;
      if(typeof price !== 'number') continue;
      let c = ((res.indicators.quote[0] || {}).close || []).filter(x => typeof x === 'number');
      if(c.length > 30){ const n = Math.ceil(c.length / 30); c = c.filter((x, i) => i % n === 0 || i === c.length - 1); }
      STOCKS[k] = {p: price, v: res.meta.chartPreviousClose || res.meta.previousClose || null, c};
      got++;
    }catch(e){}
  }
  if(!got) return;                   // offline: keep what is shown
  try{ localStorage.setItem('stocks:' + location.hash, JSON.stringify(STOCKS)); }catch(e){}
  renderPanel(false, 'stocks');
}
// a small line of the day's closes, 60 x 16, drawn only when the card's markup changes
function spark(c, up){
  if(c.length < 2) return '<svg viewBox="0 0 60 16" preserveAspectRatio="none"></svg>';
  const lo = Math.min(...c), hi = Math.max(...c), span = hi - lo || 1;
  const pts = c.map((y, i) => (i * 60 / (c.length - 1)).toFixed(1) + ',' + (15 - (y - lo) / span * 14).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 60 16" preserveAspectRatio="none" class="${up ? 'up' : 'down'}"><polyline points="${pts}"/></svg>`;
}
function stocksCard(){
  const shown = CONFIG.stocks.filter(k => STOCKS[k]);
  const allClosed = shown.length && shown.every(k => !marketOpen(isSA(k)));
  const mixed = shown.some(k => marketOpen(isSA(k)));
  const rows = shown.map(k => {
    const d = STOCKS[k], v = d.v, pct = v ? (d.p - v) / v * 100 : null;
    const up = pct !== null ? pct >= 0 : d.c.length > 1 ? d.c[d.c.length - 1] >= d.c[0] : null;
    const cls = up === null ? '' : up ? 'up' : 'down';
    return `<li class="stk"><span class="nm">${esc(stockName(k))}${mixed && !marketOpen(isSA(k)) ? '<span class="cl">' + esc(t('market.closedShort')) + '</span>' : ''}</span>`
      + (up === null ? '' : spark(d.c, up)) + `<span class="px">${num(d.p, 2)}</span>`
      + (pct === null ? '' : `<span class="chg ${cls}">${pct >= 0 ? '▲' : '▼'} ${num(Math.abs(pct), 2)}${PCT}</span>`) + '</li>';
  });
  return {hd: '<span>' + esc(t('market.stocks')) + '</span>' + (allClosed ? '<span class="until">' + esc(t('market.closed')) + '</span>' : ''), rows};
}

// verse one day, hadith the next. Verse texts come from the Quran API via CI (.github/tools/fetch_verses.py), never typed.
const VERSES = __VERSES__;   // assets/shared/verses.json
// hadith: only those .github/tools/verify_hadith.py found in the six books, each shown in full as the book has it,
// isnad and all: parts are ["n", narration] and ["q", the Prophet's words]; source is the book and its number
const HADITH = __HADITH__;   // assets/shared/hadith.json, through src/build.py
// the text's size steps down with its length (characters): up to 180 as it was, then three smaller steps
const quoteSize = n => n > 420 ? ' q3' : n > 300 ? ' q2' : n > 180 ? ' q1' : '';
// the tafsir cut at a word, «…» after it, until it fits three lines (the build already limits its length); on a card
// that is already full (a long verse on a small screen) fewer lines, none at all if not even one fits
function fitTafsir(ul){
  const el = ul.querySelector('li.tafsir');
  if(!el) return;
  const full = el.textContent.replace(/…$/, ''), words = full.split(' '), was = el.textContent !== full;
  const card = ul.closest('.week'), bar = document.querySelector('.bottom');
  const lines = () => Math.round(el.getBoundingClientRect().height / parseFloat(getComputedStyle(el).lineHeight));
  const crowded = () => { const c = card.getBoundingClientRect(); return c.height > .42 * innerHeight || c.bottom > bar.getBoundingClientRect().top - 4; };
  for(let max = 3; max > 0; max--){
    let n = words.length;
    el.textContent = full + (was ? '…' : '');
    while(lines() > max && n > 1){
      n--;
      el.textContent = words.slice(0, n).join(' ').replace(/[\s،,:؛.]+$/, '') + '…';
    }
    if(!crowded()) return;
  }
  el.remove();
}
// A card in a small place (the launcher's second or third) asks for a text no longer than card.maxLen: the first that short from the
// day's own, going on from it; none that short, the shortest.
function pickShort(list, at, len, card){
  card = card || {};
  card.len = len(list[at % list.length]);
  if(!card.maxLen) return list[at % list.length];
  let best = list[at % list.length];
  for(let k = 0; k < list.length; k++){
    const x = list[(at + k) % list.length];
    if(len(x) <= card.maxLen){ best = x; break; }
    if(len(x) < len(best)) best = x;
  }
  card.len = len(best);
  return best;
}
function quoteOfDay(card){
  const n = riyadhDayNumber(), half = Math.floor(n / 2);
  if(VERSES.length && n % 2 === 0){
    const v = pickShort(VERSES, half, x => x.text.length, card);
    return {title:t('quote.verse'), rows:[`<li class="quote quran${v.text.length > 330 ? ' q4' : quoteSize(v.text.length)}"><span class="orn">﴿</span><span class="qt">${esc(v.text)}</span><span class="orn">﴾</span></li>`, `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]
      .concat(CONFIG.tafsir && v.tafsir ? [`<li class="tafsir">${esc(v.tafsir)}</li>`] : [])};
  }
  const h = pickShort(HADITH, half, x => x.parts.reduce((m, [, t]) => m + t.length, 0), card);
  const saw = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
  const body = h.parts.map(([k, t]) => k === 'q' ? `«${saw(esc(t))}»` : `<span class="nar">${saw(esc(t))}</span>`).join(' ');
  return {title:t('quote.hadith'), rows:[`<li class="quote hadith${quoteSize(h.parts.reduce((n, [, t]) => n + t.length, 0))}">${body}</li>`, `<li class="src">${esc(h.source)}</li>`]};
}

// «أذكار الصباح والمساء» (from حصن المسلم): only those .github/tools/verify_adhkar.py found in the six books or the Quran.
// Morning ones from Fajr until Dhuhr, evening ones from Asr until Maghrib, the night ones (the end of al-Baqara) from
// Isha until Fajr; outside those hours the card shows the verse or hadith of the day. One timer, and only while a dhikr is on screen: 20 s + 0.1 s per character, at most 60 s.
const ADHKAR = __ADHKAR__;   // assets/shared/adhkar.json, through src/build.py
// Arabic keeps the words the card always showed; the Latin languages say the number and «times».
const ADHKAR_WORDS = {1:'مرة واحدة', 2:'مرتان', 3:'ثلاث مرات', 4:'أربع مرات', 7:'سبع مرات', 10:'عشر مرات', 33:'ثلاثاً وثلاثين مرة', 100:'مئة مرة'};
function adhkarCount(n){
  if(RTL && ADHKAR_WORDS[n]) return ADHKAR_WORDS[n];
  if(n === 1) return t('adhkar.once');
  if(n === 2) return t('adhkar.twice');
  return t(n >= 3 && n <= 10 ? 'adhkar.few' : 'adhkar.many', {n: ar(n)});
}
const ADHKAR_ICON = {
  morning:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>',
  evening:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
  night:'<svg viewBox="0 0 24 24"><path d="M19 13.5A7.5 7.5 0 0 1 9.5 4.4a7.5 7.5 0 1 0 9.5 9.1z"/><path d="M16.5 3.5v3M15 5h3"/></svg>',
};
const ADHKAR_HEAD = {morning:[t('adhkar.morning'), t('adhkar.morning.until')], evening:[t('adhkar.evening'), t('adhkar.evening.until')], night:[t('adhkar.night'), t('adhkar.night.until')]}   // the hadith's own words, no new category name;
// the adhkar's place in a card: card.ad = {i: which, t: the timer, mode: morning|evening|night, n: how many}
function adhkarWindow(){
  if(!DAY_TIMES) return '';
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const at = k => { const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number); return h * 60 + mi; };
  if(now >= at('Fajr') && now < at('Dhuhr')) return 'morning';
  if(now >= at('Asr') && now < at('Maghrib')) return 'evening';
  if(now >= at('Isha') || now < at('Fajr')) return 'night';   // after midnight it is still the night before
  return '';
}
function adhkarNext(card){
  card.ad.t = 0;
  card.ad.i++;
  renderCard(card, card.ad.n > 1);
  fitCards();
}
function adhkarCard(card){
  const ad = card.ad, mode = adhkarWindow(), list = mode ? ADHKAR.filter(d => d.when === mode || (d.when === 'both' && mode !== 'night')) : [];
  if(!list.length){
    clearTimeout(ad.t); ad.t = 0; ad.mode = '';
    return quoteOfDay(card);
  }
  if(mode !== ad.mode){ ad.mode = mode; ad.i = 0; clearTimeout(ad.t); ad.t = 0; }
  let i = ad.i % list.length;
  // a card in a small place skips the dhikr that is too long for it (card.maxLen), if a shorter one follows
  if(card.maxLen) for(let k = 0; k < list.length && list[i].text.length > card.maxLen; k++){ ad.i++; i = ad.i % list.length; }
  const d = list[i];
  card.len = d.text.length;
  ad.n = list.length;
  if(!ad.t) ad.t = setTimeout(() => adhkarNext(card), Math.min(60, 20 + .1 * d.text.length) * 1000);
  const dots = Math.min(list.length, 12), on = Math.floor(i * dots / list.length);
  const text = d.quran ? `<span class="orn">﴿</span><span class="qt">${esc(d.text)}</span><span class="orn">﴾</span>` : esc(d.text);
  const [title, until] = ADHKAR_HEAD[mode];
  return {
    title,
    hd: `${ADHKAR_ICON[mode]}<span>${title}</span><span class="until">${until}</span>`,
    rows: [`<li class="quote${d.quran ? ' quran' : ''}${d.text.length > 560 ? ' q4' : quoteSize(d.text.length)}">${text}</li>`,   // harakat make a dhikr long: one more step
           `<li class="adf"><span class="s">${esc(ar(d.virtue ? `${d.virtue.text} · ${d.virtue.source.replace(' · ', ' ')}` : d.source))}</span><span class="c">${adhkarCount(d.count)}</span>`
           + `<span class="d">${Array.from({length: dots}, (_, k) => k === on ? '<i class="on"></i>' : '<i></i>').join('')}</span></li>`],
  };
}

    setText(d, WX_CODES[j.current.weather_code] || '');
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    setText(document.getElementById('wx-range'),
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '');
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i]})).filter(x => x.hi != null && x.lo != null);
    try{ localStorage.setItem('forecast:' + location.hash, JSON.stringify(FORECAST)); }catch(e){}
    if(hours){
      const hr = j.hourly || {}, from = hourKey();
      HOURLY = (hr.time || []).map((t, i) => ({t, code:hr.weather_code?.[i], temp:hr.temperature_2m?.[i]})).filter(x => x.t > from && x.temp != null).slice(0, 12);
      SUN = {};
      (dl.time || []).forEach((d, i) => { const up = dl.sunrise?.[i], down = dl.sunset?.[i]; if(up && down) SUN[d] = [up.slice(11, 16), down.slice(11, 16)]; });
      try{ localStorage.setItem('hourly:' + location.hash, JSON.stringify({h:HOURLY, s:SUN})); }catch(e){}
    }
    renderPanel(false, 'forecast', 'hourly');
    if(slotNow() === 'weather') renderSlot();
  }catch(e){ return; }   // keep the last reading; with none only the city shows

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      setText(d, pm >= 400 ? t('wx.heavyDust') : t('wx.dust'));
      d.classList.add('dust');
    }
  }catch(e){}
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
function applyNight(){
  const p = riyadhParts();
  const h = p.h + p.mi/60;
  const MAX = 0.46;
  let o = 0;
  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;
  const el = document.getElementById('dimmer');
  const v = Math.max(0, Math.min(MAX, o)).toFixed(2);
  if(el && el.style.opacity !== v) el.style.opacity = v;
}

// gentle pixel shift so static text never burns into the panel
const SHIFT_SEQ = [[0,0],[3,2],[0,4],[-3,2],[-3,-2],[0,-4],[3,-2]];
let shiftTick = 0;
function pixelShift(){
  shiftTick = (shiftTick + 1) % SHIFT_SEQ.length;
  const [dx,dy] = SHIFT_SEQ[shiftTick];
  const st = document.querySelector('.stage');
  if(st) st.style.transform = `translate(${dx}px,${dy}px)`;
}

// Background photos: the hosted set in photos/ (photos/index.json in the repo). A hosted photo is used only
// once it has loaded; offline, or if it fails, a bundled one is shown, so the screen is never empty.
const PHOTO_BASE = 'https://raw.githubusercontent.com/tshi-dev/UrTV/master/photos/';
let REMOTE_BGS = (()=>{ try{ return JSON.parse(localStorage.getItem('photoIndex') || '[]'); }catch(e){ return []; } })();

// The owner's own photos: the app answers OWN_BASE N.jpg (1..CONFIG.own) from its own folder, never from the network.
const OWN_BASE = 'https://own.urtv.invalid/';
const OWN_ONLY = () => CONFIG.own > 0 && CONFIG.ownMode === 'only';
const ownPhotos = () => Array.from({length: CONFIG.own}, (_, k) => ({url: OWN_BASE + (k + 1) + '.jpg', b: {}}));   // no credit: they are not ours

async function loadPhotoIndex(){
  if(OWN_ONLY()) return;   // nothing of ours is shown, so nothing is fetched
  try{
    const r = await fetchT(PHOTO_BASE + 'index.json', 15000);
    if(!r.ok) return;
    const list = (await r.json()).filter(p => p && p.f);
    if(list.length){
      REMOTE_BGS = list;
      try{ localStorage.setItem('photoIndex', JSON.stringify(list)); }catch(e){}
    }
  }catch(e){}
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');
  cardBlurLater(url);
  const cr = document.getElementById('credit');
  if(cr) cr.textContent = b.c ? t('credit.photo', {credit:b.c}) : '';
}

// ---- card style blur: a copy of the photo behind the card, blurred once per photo, never a live backdrop-filter ----
// Made only after the photo has settled (it drifts for 60 s, then holds still) and thrown away when the photo
// changes, so nothing repaints while the screen is idle. Any failure leaves the card on its plain tint.
const CARD_FILTER = {   // blur px, then the CSS filter functions, as in the approved designs
  dark1:[6,'saturate(140%)'], glass1:[9,'saturate(170%) brightness(.62)'],
  dark3:[6,'saturate(140%)'], glass3:[9,'saturate(160%) brightness(.55)'],
};
const CARD = {cv:null, t:0, url:'', since:0};
function cardRelease(){
  clearTimeout(CARD.t); CARD.t = 0;
  if(CARD.cv){ CARD.cv.width = 0; CARD.cv.remove(); CARD.cv = null; }
}
function cardBlurLater(url){
  CARD.url = url; CARD.since = Date.now();
  cardRelease();
  if(!CARD_FILTER[CONFIG.cardStyle]) return;
  const calm = !window.matchMedia || matchMedia('(prefers-reduced-motion: no-preference)').matches;   // else it never drifts
  CARD.t = setTimeout(cardBlurNow, calm ? 61000 : 0);
}
function cardBlurNow(){
  CARD.t = 0;
  const f = CARD_FILTER[CONFIG.cardStyle], card = document.querySelector('.week'), url = CARD.url;
  if(!f || !card || !url || CONFIG.panel === 'none') return;
  try{
    const img = new Image();
    img.onload = () => {
      try{
        if(url !== CARD.url || CARD.cv) return;   // the photo changed while this loaded
        const W = innerWidth, H = innerHeight, r = card.getBoundingClientRect(), K = .25;   // a quarter size is plenty under a blur
        const [sx, sy] = SHIFT_SEQ[shiftTick];   // the stage's burn-in shift moves the card, not the photo
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(r.width * K)); cv.height = Math.max(1, Math.round(r.height * K));
        const g = cv.getContext('2d');
        const patch = () => g.setTransform(K, 0, 0, K, -(r.left - sx) * K, -(r.top - sy) * K);   // canvas = the card's patch of the screen
        patch();
        if(g.filter !== undefined) g.filter = `blur(${f[0] * K}px) ${f[1]}`;
        // where .photo draws it: cover, centred at 26%, then its final scale(1.03) about the centre
        const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.max(W / iw, H / ih), dw = iw * s, dh = ih * s;
        g.translate(W / 2, H / 2); g.scale(1.03, 1.03); g.translate(-W / 2, -H / 2);
        g.drawImage(img, (W - dw) * .5, (H - dh) * .26, dw, dh);
        g.filter = 'none';
        patch();
        g.fillStyle = `rgba(0,0,0,${document.querySelector('.photo').style.getPropertyValue('--dim') || .05})`;   // the photo's own darkness
        g.fillRect(0, 0, W, H);
        const v = g.createLinearGradient(0, 0, 0, H);   // the vertical part of .veil, the part that reaches the card
        v.addColorStop(0, 'rgba(3,10,7,.62)'); v.addColorStop(.22, 'rgba(3,10,7,.30)'); v.addColorStop(.46, 'rgba(3,10,7,.12)');
        v.addColorStop(.74, 'rgba(3,10,7,.42)'); v.addColorStop(1, 'rgba(2,6,4,.88)');
        g.fillStyle = v; g.fillRect(0, 0, W, H);
        g.translate(.22 * W, .34 * H); g.scale(1.2 * W, .85 * H);   // and its soft shade at 22% 34%
        const rg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
        rg.addColorStop(0, 'rgba(3,14,9,.42)'); rg.addColorStop(.58, 'rgba(3,14,9,0)');
        g.fillStyle = rg; g.fillRect(-1, -1, 2, 2);
        cv.className = 'bl';
        card.insertBefore(cv, card.firstChild);
        CARD.cv = cv;
        requestAnimationFrame(() => requestAnimationFrame(() => cv.classList.add('on')));
      }catch(e){ cardRelease(); }
      img.onload = null; img.src = '';
    };
    img.src = url;
  }catch(e){}
}
// a resized screen moves the card over the photo: draw the copy again (at once, the photo has settled)
let CARD_RESIZE = 0;
addEventListener('resize', () => {
  clearTimeout(CARD_RESIZE);
  CARD_RESIZE = setTimeout(() => {
    if(!CARD_FILTER[CONFIG.cardStyle] || !CARD.url) return;
    const wait = Math.max(0, 61000 - (Date.now() - CARD.since));
    cardRelease();
    CARD.t = setTimeout(cardBlurNow, wait);
  }, 400);
});

// Every 4 days a new random set of 5 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every CONFIG.photoMinutes (30 unless the owner changed it). Only the photo on screen is downloaded.
const PHOTO_SET = 5, PHOTO_PERIOD_DAYS = 4;
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
let BG_SLOT = -1, PREFETCHED = false;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slotMin = CONFIG.photoMinutes;   // divides 1440, so slots count on across midnight
    const slot = riyadhDayNumber() * (1440 / slotMin) + Math.floor((p.h * 60 + p.mi) / slotMin);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot;
    const only = OWN_ONLY(), own = ownPhotos();
    const set = !only && REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length];
    // what rotates: ours (the hosted set, else the bundled photos once the owner has some), then the owner's; only = theirs alone
    let pool = own;
    if(!only){
      const ours = set.length ? set.map(b => ({url: PHOTO_BASE + b.f, b})) : own.length ? BGS.map(b => ({url: b.u, b, bundled: true})) : [];
      pool = ours.concat(own);
    }
    if(!pool.length){ showBackground(local.u, local); return; }
    const pick = pool[slot % pool.length], url = pick.url, b = pick.b;
    if(pick.bundled){ showBackground(url, b); return; }
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    if(!PREFETCHED && set.length){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = 'snap6:' + location.hash;   // bump when the panels' markup changes
const SNAP_SEL = ['.markets', '#match-row'];
let SNAP_LAST = null;   // what is stored now: the panels rarely change, so most saves have nothing to write
const noCrestData = h => (h || '').replace(/ src="data:[^"]*"/g, '');   // the crests are kept apart
function saveSnap(){
  const s = JSON.stringify([SNAP_SEL.map(q => noCrestData((document.querySelector(q)||{}).innerHTML)),
    CARDS.map(c => [c.kind, noCrestData(c.ul.innerHTML), c.hd.innerHTML])]);
  if(s === SNAP_LAST) return;
  try{ localStorage.setItem(SNAP_KEY, s); SNAP_LAST = s; }catch(e){}
}
function restoreSnap(){
  try{
    SNAP_LAST = localStorage.getItem(SNAP_KEY);
    const v = JSON.parse(SNAP_LAST || 'null');
    if(!v) return;
    SNAP_SEL.forEach((q, i) => { const el = document.querySelector(q); if(el && v[0][i]) el.innerHTML = v[0][i]; });
    CARDS.forEach((c, i) => {   // a card gets only what its own kind drew
      const saved = v[1][i];
      if(saved && saved[0] === c.kind){ c.ul.innerHTML = saved[1]; c.hd.innerHTML = saved[2]; fillCrests(c.ul); }
    });
  }catch(e){}
}

// What the cards need to be redrawn on, one place for the screensaver and the launcher: pages turn every 25 s, the clock-driven kinds
// every 15 s (prayers, the row, the hours, the smart card, «يومك»), the windows and markets every minute.
function cardTimers(){
  const clocked = ['prayers', 'hourly', 'prayerrow', 'smart', 'today'];
  setInterval(() => renderPanel(false, ...clocked), 15000);
  setInterval(() => {
    for(const c of CARDS){
      if(c.eff === 'shows' && WEEK_POOL.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
      else if(c.eff === 'matches'){ c.page++; renderCard(c, matchRows(c).length > (c.cap || MATCH_ROWS)); }
      else if(c.eff === 'stocks' && CONFIG.stocks.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
      else if(c.eff === 'tasks' && CONFIG.tasks.length > (c.cap || WEEK_ROWS)){ c.page++; renderCard(c, true); }
    }
    fitCards();
  }, 25*1000);
  setInterval(() => renderPanel(false, 'adhkar', 'stocks', ...clocked), 60*1000);   // a window may have opened; a market opened or closed
}

function boot(){
  if(CONFIG.widget){ bootWidget(); return; }
  buildCards();
  if(document.fonts) document.fonts.ready.then(() => {   // widths change once the fonts are in
    fitMatches(document.getElementById('match-row'));
    if(MATCHES_LOADED) CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });   // whole names again where they now fit
    renderPanel(false, 'matches');
  });
  if(CONFIG.slot === 'none') document.documentElement.classList.add('slot-none');
  if(!SLOT_MATCHES) document.getElementById('match-row').textContent = '';   // not «لا شيء هذا الأسبوع»: that is the matches slot's
  if(CONFIG.cardStyle !== 'current') document.documentElement.classList.add('cs-' + CONFIG.cardStyle);
  applyI18n();
  buildMarkets();
  restoreSnap();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  const wxCity = document.getElementById('wx-city');
  if(wxCity) wxCity.textContent = CONFIG.city;
  const cs = document.getElementById('clock-sub');
  if(cs) cs.textContent = t('timeIn', {city: CONFIG.city});
  document.title = t('title');
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickOccasion(); renderSlot();
  TICKERS.forEach(loadTicker);
  if(USES('stocks')) loadStocks();
  renderPanel(false, ...CARD_KINDS.filter(k => k !== 'shows'));   // shows: its own data arrives with prayers, weather, matches
  if(NEEDS_MATCHES) loadMatches();
  loadPrayers(); if(USES('shows')) loadWeek(); loadWeather();
  applyNight(); pixelShift();

  setInterval(tickClock, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickOccasion(); if(!SLOT_MATCHES) renderSlot(); }, 15000);
  if(SLOT_MATCHES){   // the matches timers run only while the slot shows matches
    setInterval(() => renderMatches(false), 60000);
    // 15 s a page (two games), 10 s once a league makes more than 3 pages: a round of 9 games passes in 50 s, not 75
    const turn = () => { renderMatches(true); setTimeout(turn, CONFIG.leagues.length && MATCH_PAGES > 3 ? CONFIG.matchPageFastMs : CONFIG.matchPageMs); };
    setTimeout(turn, CONFIG.matchPageMs);
  }
  if(NEEDS_MATCHES){ setInterval(loadLive, 2*60000); setInterval(loadMatches, 30*60*1000); }
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(()=>{ TICKERS.forEach(loadTicker); if(USES('stocks')) loadStocks(); }, 15*60*1000);
  if(USES('shows')) setInterval(loadWeek, 6*3600*1000);
  setInterval(loadWeather, 30*60*1000);
  cardTimers();
  setInterval(applyNight, 60*1000);
  setInterval(pixelShift, 4*60*1000);
  let lastDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickOccasion(); loadPrayers(); if(NEEDS_MATCHES) loadMatches(); if(USES('shows')) loadWeek(); loadWeather(); renderPanel(false); }
  }, 60*1000);
}

// The launcher's cards: the chosen ones only (up to three), refreshed like on the screensaver, nothing else loaded.
function bootWidget(){
  document.documentElement.classList.add('widget');
  if(CONFIG.cardStyle !== 'current') document.documentElement.classList.add('cs-' + CONFIG.cardStyle);   // «شكل البطاقة» applies to each of them
  buildCards();
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  if(document.fonts) document.fonts.ready.then(() => {   // widths change once the fonts are in: the cards are fitted again
    CARDS.forEach(c => { if(c.eff === 'matches') c.ul.__h = null; });
    if(CARDS.length > 1) renderPanel(false); else renderPanel(false, 'matches');
  });
  if(USES('shows')){ loadWeek(); setInterval(loadWeek, 6*3600*1000); }
  renderPanel(false, ...CARD_KINDS.filter(k => k !== 'shows'));
  if(USES('adhkar') || USES('prayers') || USES('prayerrow')){ loadPrayers(); setInterval(loadPrayers, 6*3600*1000); }
  if(USES('forecast') || USES('hourly')){ loadWeather(); setInterval(loadWeather, 30*60*1000); }
  if(USES('matches')){ loadMatches(); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); }
  if(USES('stocks')){ loadStocks(); setInterval(loadStocks, 15*60*1000); }
  cardTimers();
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(USES('prayers') || USES('prayerrow') || USES('adhkar')) loadPrayers(); renderPanel(false); } }, 60*1000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
</script>
